<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#ffffff">

<title>ระบบพกสุข</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<style>

:root {

  --primary:
    #16877e;

  --primary-dark:
    #126e67;

  --soft:
    #e9f6f4;

  --background:
    #f7f9f8;

  --card:
    #ffffff;

  --text:
    #17211f;

  --muted:
    #7c8583;

  --border:
    #dfe5e3;

  --danger:
    #d34747;

  --warning:
    #d89315;

}


* {
  box-sizing:
    border-box;
}


html,
body {

  margin:
    0;

  padding:
    0;

  min-height:
    100%;

  background:
    var(--background);

  color:
    var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


button,
input {

  font:
    inherit;
}


button {

  cursor:
    pointer;
}


.hidden {

  display:
    none !important;
}


.app {

  width:
    100%;

  max-width:
    720px;

  min-height:
    100vh;

  margin:
    auto;

  padding-bottom:
    40px;
}


/* ==========================================================
   HEADER
   ========================================================== */

.header {

  position:
    sticky;

  top:
    0;

  z-index:
    100;

  background:
    rgba(
      255,
      255,
      255,
      .96
    );

  backdrop-filter:
    blur(12px);

  border-bottom:
    1px solid var(--border);

  padding:
    15px 18px;
}


.brand {

  display:
    flex;

  align-items:
    center;

  gap:
    11px;
}


.logo {

  width:
    46px;

  height:
    46px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    14px;

  background:
    var(--primary);

  color:
    white;

  font-size:
    26px;
}


.brand-name {

  font-size:
    22px;

  font-weight:
    900;
}


.brand-subtitle {

  margin-top:
    2px;

  color:
    var(--muted);

  font-size:
    12px;
}


/* ==========================================================
   MAIN
   ========================================================== */

main {

  padding:
    12px;
}


.card {

  margin-bottom:
    12px;

  padding:
    17px;

  background:
    var(--card);

  border:
    1px solid var(--border);

  border-radius:
    20px;
}


.title {

  font-size:
    21px;

  font-weight:
    900;
}


.subtitle {

  margin-top:
    4px;

  color:
    var(--muted);

  font-size:
    13px;
}


/* ==========================================================
   TABS
   ========================================================== */

.tabs {

  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:
    8px;
}


.tab {

  min-height:
    56px;

  padding:
    8px;

  border:
    1px solid var(--border);

  border-radius:
    15px;

  background:
    white;

  color:
    var(--text);

  font-weight:
    800;

  font-size:
    16px;
}


.tab.active {

  border-color:
    var(--primary);

  background:
    var(--primary);

  color:
    white;
}


/* ==========================================================
   QR
   ========================================================== */

#reader {

  width:
    100%;

  margin-top:
    15px;

  overflow:
    hidden;

  border-radius:
    18px;
}


#reader video {

  border-radius:
    18px;
}


.scan-help {

  margin-top:
    12px;

  text-align:
    center;

  color:
    var(--muted);

  font-size:
    12px;
}


/* ==========================================================
   SEARCH
   ========================================================== */

.search-input {

  width:
    100%;

  height:
    52px;

  margin-top:
    13px;

  padding:
    0 15px;

  border:
    1px solid var(--border);

  border-radius:
    14px;

  background:
    white;

  outline:
    none;
}


.search-input:focus {

  border-color:
    var(--primary);
}


.search-result {

  display:
    block;

  width:
    100%;

  margin-top:
    9px;

  padding:
    14px;

  text-align:
    left;

  border:
    1px solid var(--border);

  border-radius:
    14px;

  background:
    white;
}


.search-result-name {

  font-weight:
    900;

  font-size:
    16px;
}


.search-result-id {

  margin-top:
    3px;

  color:
    var(--muted);

  font-size:
    12px;
}


/* ==========================================================
   MEMBER
   ========================================================== */

.member-name {

  font-size:
    29px;

  font-weight:
    900;

  line-height:
    1.2;
}


.member-id {

  margin-top:
    6px;

  color:
    var(--muted);

  font-size:
    15px;
}


.stats {

  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:
    9px;

  margin-top:
    17px;
}


.stat {

  padding:
    14px;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    #fafcfb;
}


.stat-label {

  color:
    var(--muted);

  font-size:
    11px;
}


.stat-value {

  margin-top:
    6px;

  font-size:
    25px;

  font-weight:
    900;
}


/* ==========================================================
   ACTIVITIES
   ========================================================== */

.grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  margin-top:
    14px;
}


.activity {

  min-height:
    100px;

  padding:
    15px;

  text-align:
    left;

  border:
    1px solid var(--border);

  border-radius:
    18px;

  background:
    white;
}


.activity.selected {

  border:
    2px solid var(--primary);

  background:
    var(--soft);
}


.activity-name {

  font-size:
    18px;

  font-weight:
    900;
}


.activity-point {

  margin-top:
    8px;

  color:
    var(--muted);

  font-size:
    13px;
}


/* ==========================================================
   PHOTO
   ========================================================== */

.button {

  width:
    100%;

  min-height:
    52px;

  margin-top:
    10px;

  border:
    0;

  border-radius:
    14px;

  background:
    var(--primary);

  color:
    white;

  font-weight:
    900;
}


.button:active {

  background:
    var(--primary-dark);
}


.button.secondary {

  border:
    1px solid var(--primary);

  background:
    white;

  color:
    var(--primary);
}


#photoInput {

  display:
    none;
}


#photoPreview {

  width:
    100%;

  max-height:
    320px;

  margin-top:
    12px;

  object-fit:
    cover;

  border-radius:
    16px;

  border:
    1px solid var(--border);
}


/* ==========================================================
   REWARDS
   ========================================================== */

.reward {

  padding:
    15px;

  text-align:
    left;

  border:
    1px solid var(--border);

  border-radius:
    18px;

  background:
    white;
}


.reward-name {

  font-size:
    17px;

  font-weight:
    900;
}


.reward-detail {

  margin-top:
    7px;

  color:
    var(--muted);

  font-size:
    12px;
}


/* ==========================================================
   STATUS
   ========================================================== */

#status {

  margin:
    10px 2px;

  padding:
    11px;

  text-align:
    center;

  color:
    var(--muted);

  font-size:
    13px;
}


#status.error {

  color:
    var(--danger);
}


/* ==========================================================
   LOADING
   ========================================================== */

.overlay {

  position:
    fixed;

  inset:
    0;

  z-index:
    9999;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

  background:
    rgba(
      255,
      255,
      255,
      .88
    );

  backdrop-filter:
    blur(5px);
}


.loading-box {

  min-width:
    220px;

  padding:
    20px;

  text-align:
    center;

  border:
    1px solid var(--border);

  border-radius:
    18px;

  background:
    white;

  font-weight:
    800;
}


@media (
  max-width: 420px
) {

  .tab {

    font-size:
      14px;
  }


  .member-name {

    font-size:
      25px;
  }


  .stat {

    padding:
      10px;
  }


  .stat-value {

    font-size:
      21px;
  }

}

</style>

</head>


<body>


<div
  id="loading"
  class="overlay hidden">

  <div
    id="loadingText"
    class="loading-box">

    กำลังทำงาน...

  </div>

</div>


<div class="app">


<header class="header">

  <div class="brand">

    <div class="logo">
      ♥
    </div>

    <div>

      <div class="brand-name">
        ระบบพกสุข
      </div>

      <div class="brand-subtitle">
        เครื่องส่วนกลาง
      </div>

    </div>

  </div>

</header>


<main>


<!-- ======================================================
     TABS
     ====================================================== -->

<div class="card">

  <div class="tabs">

    <button
      id="tabQr"
      class="tab active"
      onclick="showQr()">

      📷 QR

    </button>


    <button
      id="tabSearch"
      class="tab"
      onclick="showSearch()">

      🔎 ค้นชื่อ

    </button>


    <button
      id="tabReward"
      class="tab"
      onclick="showRewards()">

      🎁 แลกแต้ม

    </button>

  </div>

</div>


<!-- ======================================================
     QR
     ====================================================== -->

<section
  id="qrSection"
  class="card">

  <div class="title">
    สแกนสมาชิก
  </div>

  <div class="subtitle">
    นำ QR Code สมาชิกมาไว้ในกรอบ
  </div>

  <div id="reader"></div>

  <div class="scan-help">
    ระบบจะเปิดข้อมูลสมาชิกโดยอัตโนมัติ
  </div>

</section>


<!-- ======================================================
     SEARCH
     ====================================================== -->

<section
  id="searchSection"
  class="card hidden">

  <div class="title">
    ค้นหาสมาชิก
  </div>

  <div class="subtitle">
    พิมพ์ชื่อ-สกุล หรือรหัสสมาชิก
  </div>


  <input
    id="searchInput"
    class="search-input"
    type="search"
    placeholder="เช่น ปัญญา หรือ M000001"
    autocomplete="off"
    oninput="searchChanged()">


  <div id="searchResults"></div>

</section>


<!-- ======================================================
     MEMBER
     ====================================================== -->

<section
  id="memberSection"
  class="hidden">


  <div class="card">

    <div
      id="memberName"
      class="member-name">
    </div>


    <div
      id="memberId"
      class="member-id">
    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          คะแนนสะสม
        </div>

        <div
          id="lifetimePoints"
          class="stat-value">

          0

        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          แต้มคงเหลือ
        </div>

        <div
          id="availablePoints"
          class="stat-value">

          0

        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          อันดับ
        </div>

        <div
          id="currentRank"
          class="stat-value">

          -

        </div>

      </div>

    </div>

  </div>


  <!-- ACTIVITIES -->

  <div
    id="activityCard"
    class="card">

    <div class="title">
      เลือกกิจกรรม
    </div>


    <div
      id="activityGrid"
      class="grid">
    </div>

  </div>


  <!-- PHOTO -->

  <div
    id="photoCard"
    class="card">

    <button
      class="button secondary"
      onclick="takePhoto()">

      📷 ถ่ายภาพ

    </button>


    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="photoChanged(event)">


    <img
      id="photoPreview"
      class="hidden"
      alt="ภาพยืนยันกิจกรรม">


    <button
      id="confirmButton"
      class="button"
      onclick="confirmCheckin()">

      ✓ ยืนยันกิจกรรม

    </button>

  </div>


  <!-- REWARDS -->

  <div
    id="rewardCard"
    class="card hidden">

    <div class="title">
      เลือกของรางวัล
    </div>

    <div class="subtitle">
      การแลกแต้มจะไม่ลดคะแนนสะสมและอันดับ
    </div>


    <div
      id="rewardGrid"
      class="grid">
    </div>

  </div>


</section>


<div id="status">
  กำลังเชื่อมต่อระบบ...
</div>


</main>

</div>


<script>

/* ==========================================================
   CONFIG
   ========================================================== */

const WORKER_URL =
  'https://poksuk-central-api.rmuti8-esmartservice1-01.workers.dev/';


const state = {

  scanner:
    null,

  running:
    false,

  locked:
    false,

  member:
    null,

  scannedQr:
    '',

  selectedActivity:
    '',

  photo:
    '',

  activities:
    [],

  mode:
    'QR'

};


let searchTimer =
  null;


/* ==========================================================
   INIT
   ========================================================== */

document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init() {

  showLoading(
    'กำลังเชื่อมต่อระบบ...'
  );


  try {

    /*
     * โหลด PING + กิจกรรมพร้อมกัน
     */
    const results =
      await Promise.all([
        api(
          'PING',
          {}
        ),

        api(
          'ACTIVITIES',
          {}
        )
      ]);


    state.activities =
      Array.isArray(
        results[1].activities
      )
        ? results[1].activities
        : [];


    renderActivities();


    setStatus(
      'พร้อมใช้งาน'
    );


    await startCamera();


  } catch (error) {

    setStatus(
      errorMessage(
        error
      ),
      true
    );

  } finally {

    hideLoading();
  }
}


/* ==========================================================
   API
   ========================================================== */

async function api(
  action,
  payload = {}
) {

  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function() {

        controller.abort();

      },
      20000
    );


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            'POST',

          mode:
            'cors',

          cache:
            'no-store',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              action:
                action,

              payload:
                payload

            }),

          signal:
            controller.signal

        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        'Central API ตอบกลับไม่ถูกต้อง'
      );
    }


    if (!response.ok) {

      throw new Error(

        'HTTP ' +
        response.status +
        ': ' +
        (
          data.message ||
          'Central API Error'
        )

      );
    }


    if (!data.success) {

      throw new Error(
        data.message ||
        'ระบบไม่สามารถดำเนินการได้'
      );
    }


    return data;


  } catch (error) {

    console.error(
      'API ERROR',
      action,
      error
    );


    if (
      error &&
      error.name ===
      'AbortError'
    ) {

      throw new Error(
        'เชื่อมต่อระบบนานเกิน 20 วินาที กรุณาลองใหม่'
      );
    }


    const message =
      String(
        error &&
        error.message
          ? error.message
          : error
      );


    if (
      message
        .toLowerCase()
        .includes(
          'load failed'
        )
    ) {

      throw new Error(
        'เชื่อมต่อ Central API ไม่สำเร็จ กรุณาลองสแกนใหม่'
      );
    }


    throw error;


  } finally {

    clearTimeout(
      timeout
    );
  }
}


/* ==========================================================
   TABS
   ========================================================== */

async function showQr() {

  state.mode =
    'QR';


  activateTab(
    'tabQr'
  );


  hide(
    'searchSection'
  );


  hide(
    'memberSection'
  );


  show(
    'qrSection'
  );


  resetMember();


  setStatus(
    'พร้อมสแกน QR'
  );


  await startCamera();
}


async function showSearch() {

  state.mode =
    'SEARCH';


  activateTab(
    'tabSearch'
  );


  await stopCamera();


  hide(
    'qrSection'
  );


  hide(
    'memberSection'
  );


  show(
    'searchSection'
  );


  resetMember();


  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';


  document
    .getElementById(
      'searchResults'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'searchInput'
    )
    .focus();


  setStatus(
    'พิมพ์ชื่อสมาชิกอย่างน้อย 2 ตัวอักษร'
  );
}


async function showRewards() {

  state.mode =
    'REWARD';


  activateTab(
    'tabReward'
  );


  await stopCamera();


  hide(
    'qrSection'
  );


  hide(
    'memberSection'
  );


  show(
    'searchSection'
  );


  resetMember();


  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';


  document
    .getElementById(
      'searchResults'
    )
    .innerHTML =
      '';


  document
    .getElementById(
      'searchInput'
    )
    .focus();


  setStatus(
    'ค้นหาสมาชิกที่ต้องการแลกแต้ม'
  );
}


function activateTab(
  id
) {

  document
    .querySelectorAll(
      '.tab'
    )
    .forEach(
      function(element) {

        element
          .classList
          .remove(
            'active'
          );

      }
    );


  document
    .getElementById(
      id
    )
    .classList
    .add(
      'active'
    );
}


/* ==========================================================
   CAMERA
   ========================================================== */

async function startCamera() {

  if (
    state.running
  ) {

    return;
  }


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'ไม่พบกล้องในอุปกรณ์'
      );
    }


    /*
     * ใช้กล้องตัวท้าย
     * โดยทั่วไปคือกล้องหลัง
     */
    const camera =
      cameras[
        cameras.length - 1
      ];


    state.scanner =
      new Html5Qrcode(
        'reader'
      );


    await state.scanner.start(

      camera.id,

      {

        fps:
          10,

        qrbox: {

          width:
            260,

          height:
            260

        },

        aspectRatio:
          1

      },

      qrSuccess,

      function() {

        /*
         * ไม่แสดง error
         * ทุก frame
         */
      }

    );


    state.running =
      true;


  } catch (error) {

    state.running =
      false;


    setStatus(
      'ไม่สามารถเปิดกล้องได้: ' +
      errorMessage(
        error
      ),
      true
    );
  }
}


async function stopCamera() {

  if (
    !state.scanner
  ) {

    state.running =
      false;

    return;
  }


  try {

    if (
      state.running
    ) {

      await state.scanner.stop();
    }


    state.scanner.clear();

  } catch (error) {

    console.log(
      error
    );
  }


  state.scanner =
    null;


  state.running =
    false;
}


/* ==========================================================
   QR SUCCESS
   ========================================================== */

async function qrSuccess(
  text
) {

  if (
    state.locked ||
    !text
  ) {

    return;
  }


  state.locked =
    true;


  state.scannedQr =
    String(
      text
    ).trim();


  showLoading(
    'กำลังตรวจสอบสมาชิก...'
  );


  try {

    /*
     * สำคัญ:
     * ให้ PREVIEW สำเร็จก่อน
     * แล้วค่อยหยุดกล้อง
     */
    const member =
      await api(
        'PREVIEW',
        {

          scannedQr:
            state.scannedQr

        }
      );


    await stopCamera();


    openMember(
      member
    );


  } catch (error) {

    state.locked =
      false;


    state.scannedQr =
      '';


    setStatus(
      errorMessage(
        error
      ),
      true
    );


  } finally {

    hideLoading();
  }
}


/* ==========================================================
   SEARCH
   ========================================================== */

function searchChanged() {

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      searchMembers,
      350
    );
}


async function searchMembers() {

  const input =
    document.getElementById(
      'searchInput'
    );


  const query =
    input.value.trim();


  const container =
    document.getElementById(
      'searchResults'
    );


  if (
    query.length < 2
  ) {

    container.innerHTML =
      '';

    return;
  }


  container.innerHTML =
    '<div class="scan-help">กำลังค้นหา...</div>';


  try {

    const result =
      await api(
        'SEARCH_MEMBER',
        {

          query:
            query

        }
      );


    const members =
      Array.isArray(
        result.members
      )
        ? result.members
        : [];


    if (
      members.length === 0
    ) {

      container.innerHTML =
        '<div class="scan-help">ไม่พบสมาชิก</div>';

      return;
    }


    container.innerHTML =
      '';


    members.forEach(
      function(member) {

        const button =
          document
            .createElement(
              'button'
            );


        button.type =
          'button';


        button.className =
          'search-result';


        button.innerHTML =

          '<div class="search-result-name">' +

          escapeHtml(
            member.fullName
          ) +

          '</div>' +

          '<div class="search-result-id">' +

          escapeHtml(
            member.memberId
          ) +

          '</div>';


        button.onclick =
          function() {

            chooseMember(
              member.memberId
            );

          };


        container.appendChild(
          button
        );
      });


  } catch (error) {

    container.innerHTML =
      '';


    setStatus(
      errorMessage(
        error
      ),
      true
    );
  }
}


async function chooseMember(
  memberId
) {

  showLoading(
    'กำลังเปิดข้อมูลสมาชิก...'
  );


  try {

    const member =
      await api(
        'PREVIEW_MEMBER',
        {

          memberId:
            memberId

        }
      );


    openMember(
      member
    );


  } catch (error) {

    setStatus(
      errorMessage(
        error
      ),
      true
    );


  } finally {

    hideLoading();
  }
}


/* ==========================================================
   OPEN MEMBER
   ========================================================== */

async function openMember(
  member
) {

  state.member =
    member;


  hide(
    'qrSection'
  );


  hide(
    'searchSection'
  );


  show(
    'memberSection'
  );


  document
    .getElementById(
      'memberName'
    )
    .textContent =
      member.fullName ||
      '-';


  document
    .getElementById(
      'memberId'
    )
    .textContent =
      member.memberId ||
      '';


  document
    .getElementById(
      'lifetimePoints'
    )
    .textContent =
      Number(
        member.lifetimePoints ||
        0
      );


  document
    .getElementById(
      'availablePoints'
    )
    .textContent =
      Number(
        member.availablePoints !==
        undefined
          ? member.availablePoints
          : (
              member.totalPoints ||
              0
            )
      );


  document
    .getElementById(
      'currentRank'
    )
    .textContent =
      member.currentRank
        ? '#' +
          member.currentRank
        : '-';


  if (
    state.mode ===
    'REWARD'
  ) {

    hide(
      'activityCard'
    );


    hide(
      'photoCard'
    );


    show(
      'rewardCard'
    );


    await loadRewards();

  } else {

    show(
      'activityCard'
    );


    show(
      'photoCard'
    );


    hide(
      'rewardCard'
    );


    setStatus(
      'เลือกกิจกรรมและถ่ายภาพ'
    );
  }
}


/* ==========================================================
   ACTIVITIES
   ========================================================== */

function renderActivities() {

  const container =
    document.getElementById(
      'activityGrid'
    );


  container.innerHTML =
    '';


  state.activities.forEach(
    function(activity) {

      const button =
        document
          .createElement(
            'button'
          );


      button.type =
        'button';


      button.className =
        'activity';


      const health =
        activity.activityType ===
        'HEALTH_CHECK';


      button.innerHTML =

        '<div class="activity-name">' +

        escapeHtml(
          activity.activityName
        ) +

        '</div>' +

        '<div class="activity-point">' +

        (
          health
            ? 'รออนุมัติ +' +
              Number(
                activity.point ||
                2
              ) +
              ' คะแนน'
            : '+' +
              Number(
                activity.point ||
                0
              ) +
              ' คะแนน'
        ) +

        '</div>';


      button.onclick =
        function() {

          state.selectedActivity =
            activity.activityId;


          document
            .querySelectorAll(
              '.activity'
            )
            .forEach(
              function(element) {

                element
                  .classList
                  .remove(
                    'selected'
                  );

              }
            );


          button
            .classList
            .add(
              'selected'
            );


          setStatus(
            'เลือก ' +
            activity.activityName
          );
        };


      container.appendChild(
        button
      );
    });
}


/* ==========================================================
   PHOTO
   ========================================================== */

function takePhoto() {

  const input =
    document.getElementById(
      'photoInput'
    );


  input.value =
    '';


  input.click();
}


async function photoChanged(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  showLoading(
    'กำลังเตรียมภาพ...'
  );


  try {

    /*
     * ลดขนาดเพื่อให้เร็ว
     */
    state.photo =
      await resizeImage(
        file,
        600,
        .62
      );


    const preview =
      document.getElementById(
        'photoPreview'
      );


    preview.src =
      state.photo;


    show(
      'photoPreview'
    );


    setStatus(
      'พร้อมยืนยันกิจกรรม'
    );


  } catch (error) {

    setStatus(
      'ไม่สามารถเตรียมรูปได้',
      true
    );


  } finally {

    hideLoading();
  }
}


function resizeImage(
  file,
  maxSize,
  quality
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const image =
            new Image();


          image.onload =
            function() {

              const ratio =
                Math.min(

                  1,

                  maxSize /
                  image.width,

                  maxSize /
                  image.height

                );


              const canvas =
                document
                  .createElement(
                    'canvas'
                  );


              canvas.width =
                Math.round(
                  image.width *
                  ratio
                );


              canvas.height =
                Math.round(
                  image.height *
                  ratio
                );


              const context =
                canvas.getContext(
                  '2d'
                );


              context.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  quality
                )
              );
            };


          image.onerror =
            reject;


          image.src =
            event.target.result;
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );
}


/* ==========================================================
   CHECK-IN
   ========================================================== */

async function confirmCheckin() {

  if (
    !state.member
  ) {

    setStatus(
      'ไม่พบสมาชิก',
      true
    );

    return;
  }


  if (
    !state.selectedActivity
  ) {

    setStatus(
      'กรุณาเลือกกิจกรรม',
      true
    );

    return;
  }


  if (
    !state.photo
  ) {

    setStatus(
      'กรุณาถ่ายภาพ',
      true
    );

    return;
  }


  showLoading(
    'กำลังบันทึกกิจกรรม...'
  );


  try {

    const payload = {

      activityId:
        state.selectedActivity,

      photoDataUrl:
        state.photo

    };


    /*
     * QR
     */
    if (
      state.scannedQr
    ) {

      payload.scannedQr =
        state.scannedQr;

    }

    /*
     * SEARCH
     */
    else {

      payload.memberId =
        state.member.memberId;
    }


    const result =
      await api(
        'CHECKIN',
        payload
      );


    alert(
      result.message ||
      'ลงทะเบียนสำเร็จ'
    );


    /*
     * สำเร็จแล้วกลับสแกนใหม่
     */
    await resetHome();


  } catch (error) {

    setStatus(
      errorMessage(
        error
      ),
      true
    );


  } finally {

    hideLoading();
  }
}


/* ==========================================================
   REWARDS
   ========================================================== */

async function loadRewards() {

  if (
    !state.member
  ) {
    return;
  }


  showLoading(
    'กำลังโหลดของรางวัล...'
  );


  try {

    const result =
      await api(
        'REWARDS',
        {

          memberId:
            state.member.memberId

        }
      );


    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        Number(
          result.availablePoints ||
          0
        );


    const container =
      document.getElementById(
        'rewardGrid'
      );


    const rewards =
      Array.isArray(
        result.rewards
      )
        ? result.rewards
        : [];


    if (
      rewards.length === 0
    ) {

      container.innerHTML =
        '<div class="subtitle">ยังไม่มีของรางวัล</div>';

      return;
    }


    container.innerHTML =
      '';


    rewards.forEach(
      function(reward) {

        const button =
          document
            .createElement(
              'button'
            );


        button.type =
          'button';


        button.className =
          'reward';


        button.innerHTML =

          '<div class="reward-name">' +

          escapeHtml(
            reward.rewardName
          ) +

          '</div>' +

          '<div class="reward-detail">' +

          Number(
            reward.pointsRequired ||
            0
          ) +

          ' แต้ม • คงเหลือ ' +

          Number(
            reward.stock ||
            0
          ) +

          '</div>';


        button.onclick =
          function() {

            redeemReward(
              reward
            );

          };


        container.appendChild(
          button
        );
      });


  } catch (error) {

    setStatus(
      errorMessage(
        error
      ),
      true
    );


  } finally {

    hideLoading();
  }
}


async function redeemReward(
  reward
) {

  if (
    !state.member
  ) {
    return;
  }


  const confirmed =
    confirm(

      'ยืนยันแลก ' +

      reward.rewardName +

      '\nใช้ ' +

      reward.pointsRequired +

      ' แต้ม?'

    );


  if (!confirmed) {
    return;
  }


  showLoading(
    'กำลังแลกแต้ม...'
  );


  try {

    const result =
      await api(
        'REDEEM',
        {

          memberId:
            state.member.memberId,

          rewardId:
            reward.rewardId

        }
      );


    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        Number(
          result.availablePoints ||
          0
        );


    alert(

      'แลกของรางวัลสำเร็จ\n' +

      'แต้มคงเหลือ ' +

      result.availablePoints

    );


    await loadRewards();


  } catch (error) {

    setStatus(
      errorMessage(
        error
      ),
      true
    );


  } finally {

    hideLoading();
  }
}


/* ==========================================================
   RESET
   ========================================================== */

async function resetHome() {

  resetMember();


  state.mode =
    'QR';


  activateTab(
    'tabQr'
  );


  hide(
    'memberSection'
  );


  hide(
    'searchSection'
  );


  show(
    'qrSection'
  );


  setStatus(
    'พร้อมสแกนสมาชิกคนถัดไป'
  );


  await startCamera();
}


function resetMember() {

  state.member =
    null;


  state.scannedQr =
    '';


  state.selectedActivity =
    '';


  state.photo =
    '';


  state.locked =
    false;


  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(
      function(element) {

        element
          .classList
          .remove(
            'selected'
          );

      }
    );


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    '';


  hide(
    'photoPreview'
  );


  document
    .getElementById(
      'photoInput'
    )
    .value =
      '';
}


/* ==========================================================
   UI
   ========================================================== */

function show(
  id
) {

  const element =
    document.getElementById(
      id
    );


  if (element) {

    element
      .classList
      .remove(
        'hidden'
      );
  }
}


function hide(
  id
) {

  const element =
    document.getElementById(
      id
    );


  if (element) {

    element
      .classList
      .add(
        'hidden'
      );
  }
}


function showLoading(
  text
) {

  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      text ||
      'กำลังทำงาน...';


  show(
    'loading'
  );
}


function hideLoading() {

  hide(
    'loading'
  );
}


function setStatus(
  text,
  error
) {

  const element =
    document.getElementById(
      'status'
    );


  element.textContent =
    text ||
    '';


  element.className =
    error
      ? 'error'
      : '';
}


function errorMessage(
  error
) {

  if (
    error &&
    error.message
  ) {

    return error.message;
  }


  return String(
    error ||
    'เกิดข้อผิดพลาด'
  );
}


function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#39;'
    );
}
