<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>ระบบพกสุข - เครื่องส่วนกลาง</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

:root {
  --primary:#158077;
  --primary-dark:#0e625c;
  --soft:#e9f7f5;
  --bg:#f7f8f8;
  --white:#fff;
  --text:#172321;
  --muted:#7b8583;
  --border:#e1e6e5;
  --danger:#d44747;
  --success:#148253;
}

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  min-height:100%;
}

body {
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input {
  font:inherit;
}

.hidden {
  display:none !important;
}

.app {
  width:min(100%,680px);
  margin:auto;
  padding-bottom:
    calc(24px + env(safe-area-inset-bottom));
}


/* HEADER */

header {
  display:flex;
  align-items:center;
  gap:11px;

  background:white;

  padding:
    calc(11px + env(safe-area-inset-top))
    15px
    11px;

  border-bottom:
    1px solid var(--border);
}

.logo {
  width:43px;
  height:43px;

  display:grid;
  place-items:center;

  border-radius:13px;

  background:var(--primary);
  color:white;

  font-size:23px;
}

.brand {
  font-size:17px;
  font-weight:900;
}

.brand-sub {
  margin-top:2px;
  font-size:11px;
  color:var(--muted);
}


/* MAIN */

main {
  padding:10px;
}

.card {
  margin-bottom:10px;
  padding:16px;

  background:white;

  border:
    1px solid var(--border);

  border-radius:19px;
}

.title {
  margin:0;
  font-size:19px;
  font-weight:900;
}

.subtitle {
  margin-top:4px;

  color:var(--muted);

  font-size:12px;
  line-height:1.5;
}


/* CAMERA */

#reader {
  width:100%;

  margin-top:13px;

  overflow:hidden;

  background:#101615;

  border-radius:16px;
}

#reader video {
  width:100% !important;
}

.camera-status {
  margin-top:9px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}


/* MEMBER */

.member-name {
  font-size:25px;
  font-weight:900;
}

.member-id {
  margin-top:2px;

  color:var(--muted);

  font-size:12px;
}

.stats {
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;

  margin-top:14px;
}

.stat {
  padding:13px;

  background:#f8faf9;

  border:
    1px solid var(--border);

  border-radius:14px;
}

.stat-label {
  font-size:11px;

  color:var(--muted);
}

.stat-value {
  margin-top:4px;

  font-size:25px;

  font-weight:900;
}


/* ACTIVITY */

.activity-grid {
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;

  margin-top:12px;
}

.activity {
  min-height:84px;

  padding:12px;

  text-align:left;

  background:white;

  border:
    1px solid var(--border);

  border-radius:15px;

  color:var(--text);

  font-weight:800;
}

.activity.selected {
  background:var(--soft);

  border-color:
    var(--primary);

  color:
    var(--primary-dark);

  box-shadow:
    inset 0 0 0 1px
    var(--primary);
}

.activity-icon {
  display:block;

  margin-bottom:4px;

  font-size:23px;
}

.activity-point {
  display:block;

  margin-top:5px;

  color:var(--muted);

  font-size:10px;

  font-weight:600;
}


/* BUTTON */

.button {
  width:100%;

  min-height:53px;

  margin-top:10px;

  border:0;

  border-radius:14px;

  padding:12px;

  font-weight:900;
}

.button.primary {
  background:var(--primary);
  color:white;
}

.button.soft {
  background:var(--soft);

  color:var(--primary-dark);

  border:
    1px solid #c9e8e4;
}

.button:disabled {
  opacity:.45;
}


/* PHOTO */

#photoInput {
  display:none;
}

#photoPreview {
  width:100%;

  max-height:300px;

  margin-top:10px;

  object-fit:cover;

  border-radius:14px;
}


/* STATUS */

#status {
  margin-top:8px;

  padding:10px;

  border-radius:11px;

  text-align:center;

  color:var(--muted);

  background:white;

  font-size:12px;
}

#status.error {
  color:var(--danger);

  background:#fff0f0;
}


/* LOADING */

.loading {
  position:fixed;

  inset:0;

  z-index:10000;

  display:flex;

  align-items:center;

  justify-content:center;

  background:
    rgba(255,255,255,.90);
}

.loading-box {
  padding:15px 20px;

  background:white;

  border-radius:15px;

  font-weight:900;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.12);
}


/* SUCCESS */

.success {
  position:fixed;

  inset:0;

  z-index:11000;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(247,248,248,.97);
}

.success-card {
  width:min(100%,330px);

  padding:28px 18px;

  background:white;

  border-radius:22px;

  text-align:center;
}

.success-icon {
  font-size:56px;

  color:var(--success);
}

.success-title {
  margin-top:7px;

  font-size:22px;

  color:var(--success);

  font-weight:900;
}

.success-detail {
  margin-top:6px;

  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}

</style>

</head>


<body>


<div
  id="loading"
  class="loading hidden">

  <div
    id="loadingText"
    class="loading-box">

    กำลังทำงาน...

  </div>

</div>


<div
  id="success"
  class="success hidden">

  <div class="success-card">

    <div class="success-icon">
      ✓
    </div>

    <div class="success-title">
      ลงทะเบียนสำเร็จ
    </div>

    <div
      id="successDetail"
      class="success-detail">
    </div>

  </div>

</div>


<div class="app">


<header>

  <div class="logo">
    ♥
  </div>

  <div>

    <div class="brand">
      ระบบพกสุข
    </div>

    <div class="brand-sub">
      เครื่องสแกนส่วนกลาง • Fast Mode
    </div>

  </div>

</header>


<main>


<!-- CAMERA -->

<section
  id="cameraSection"
  class="card">

  <div class="title">
    สแกนสมาชิก
  </div>

  <div class="subtitle">
    นำ QR Code ของสมาชิกมาไว้ในกรอบ
  </div>

  <div id="reader"></div>

  <button
    id="openCameraButton"
    type="button"
    class="button primary hidden"
    onclick="startCamera()">

    📷 เปิดกล้อง

  </button>

  <div
    id="cameraStatus"
    class="camera-status">

    กำลังเตรียมกล้อง...

  </div>

</section>



<!-- MEMBER -->

<section
  id="memberSection"
  class="hidden">


  <div class="card">

    <div
      id="memberName"
      class="member-name">
    </div>

    <div
      id="memberId"
      class="member-id">
    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          คะแนนสะสม
        </div>

        <div
          id="memberPoints"
          class="stat-value">

          0

        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          ลำดับ
        </div>

        <div
          id="memberRank"
          class="stat-value">

          -

        </div>

      </div>

    </div>

  </div>



  <div class="card">

    <div class="title">
      เลือกกิจกรรม
    </div>

    <div
      id="activityGrid"
      class="activity-grid">
    </div>

  </div>



  <div class="card">

    <div class="title">
      ภาพกิจกรรม
    </div>

    <div class="subtitle">
      ถ่ายภาพก่อนยืนยัน
    </div>


    <button
      type="button"
      class="button soft"
      onclick="openPhoto()">

      📷 ถ่ายภาพ

    </button>


    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="onPhotoSelected(event)">


    <img
      id="photoPreview"
      class="hidden">


    <button
      id="confirmButton"
      type="button"
      class="button primary"
      onclick="confirmCheckin()">

      ✓ ยืนยัน

    </button>

  </div>


</section>


<div id="status">
  กำลังเชื่อมต่อระบบ...
</div>


</main>

</div>


<script>

/* ==========================================================
   WORKER
   ========================================================== */

const WORKER_URL =
  'https://poksuk-central-api.rmuti8-esmartservice1-01.workers.dev/';



/* ==========================================================
   STATE
   ========================================================== */

const state = {

  scanner:
    null,

  cameraRunning:
    false,

  locked:
    false,

  scannedQr:
    '',

  member:
    null,

  activities:
    [],

  selectedActivity:
    '',

  photo:
    ''

};



/* ==========================================================
   INIT
   ========================================================== */

document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init() {

  try {

    /*
     * โหลด PING + ACTIVITIES พร้อมกัน
     * ลดเวลารอหน้าแรก
     */
    const results =
      await Promise.all([

        callApi(
          'PING'
        ),

        callApi(
          'ACTIVITIES'
        )

      ]);


    state.activities =
      Array.isArray(
        results[1].activities
      )
        ? results[1].activities
        : [];


    renderActivities();


    setStatus(
      'พร้อมสแกนสมาชิก'
    );


    await startCamera();


  } catch (error) {

    setStatus(
      error.message,
      true
    );


    document
      .getElementById(
        'openCameraButton'
      )
      .classList
      .remove(
        'hidden'
      );
  }
}



/* ==========================================================
   API
   ========================================================== */

async function callApi(
  action,
  payload = {}
) {

  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function() {

        controller.abort();

      },
      20000
    );


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'application/json'

          },

          body:
            JSON.stringify({

              action:
                action,

              payload:
                payload

            }),

          signal:
            controller.signal

        }
      );


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        'ระบบไม่สามารถดำเนินการได้'
      );
    }


    return result;


  } catch (error) {

    if (
      error.name ===
      'AbortError'
    ) {

      throw new Error(
        'ระบบใช้เวลานานเกินไป กรุณาลองใหม่'
      );
    }


    throw error;


  } finally {

    clearTimeout(
      timeout
    );
  }
}



/* ==========================================================
   CAMERA
   ========================================================== */

async function startCamera() {

  if (
    state.cameraRunning
  ) {

    return;
  }


  state.locked =
    false;


  document
    .getElementById(
      'openCameraButton'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'cameraStatus'
    )
    .textContent =
      'กำลังเปิดกล้อง...';


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'ไม่พบกล้อง'
      );
    }


    let selected =
      cameras[
        cameras.length - 1
      ];


    const rear =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ''
            )
              .toLowerCase();


          return (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment')
          );

        }
      );


    if (rear) {

      selected =
        rear;
    }


    state.scanner =
      new Html5Qrcode(
        'reader'
      );


    await state.scanner.start(

      selected.id,

      {

        fps:
          12,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) *
                .72
              );


            return {

              width:
                size,

              height:
                size

            };
          }

      },

      onQrSuccess,

      function() {}

    );


    state.cameraRunning =
      true;


    document
      .getElementById(
        'cameraStatus'
      )
      .textContent =
        'พร้อมสแกน';


  } catch (error) {

    state.cameraRunning =
      false;


    document
      .getElementById(
        'openCameraButton'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(
      'เปิดกล้องไม่สำเร็จ: ' +
      (
        error.message ||
        error
      ),
      true
    );
  }
}



async function stopCamera() {

  if (!state.scanner) {

    state.cameraRunning =
      false;

    return;
  }


  try {

    if (
      state.cameraRunning
    ) {

      await state.scanner.stop();
    }

  } catch (error) {

    console.log(
      error
    );
  }


  try {

    state.scanner.clear();

  } catch (error) {

    console.log(
      error
    );
  }


  state.scanner =
    null;


  state.cameraRunning =
    false;
}



async function onQrSuccess(
  decodedText
) {

  if (
    state.locked ||
    !decodedText
  ) {

    return;
  }


  state.locked =
    true;


  state.scannedQr =
    String(
      decodedText
    ).trim();


  /*
   * เริ่มยิง Preview ก่อน
   * แล้วหยุดกล้อง
   */
  const previewPromise =
    callApi(
      'PREVIEW',
      {

        scannedQr:
          state.scannedQr

      }
    );


  await stopCamera();


  showLoading(
    'กำลังตรวจสอบสมาชิก...'
  );


  try {

    const member =
      await previewPromise;


    state.member =
      member;


    document
      .getElementById(
        'memberName'
      )
      .textContent =
        member.fullName ||
        '-';


    document
      .getElementById(
        'memberId'
      )
      .textContent =
        member.memberId ||
        '';


    document
      .getElementById(
        'memberPoints'
      )
      .textContent =
        Number(
          member.totalPoints || 0
        );


    document
      .getElementById(
        'memberRank'
      )
      .textContent =
        member.currentRank
          ? '#' +
            member.currentRank
          : '-';


    hideLoading();


    document
      .getElementById(
        'cameraSection'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'memberSection'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(
      'เลือกกิจกรรมและถ่ายภาพ'
    );


  } catch (error) {

    hideLoading();


    setStatus(
      error.message,
      true
    );


    setTimeout(
      resetForNextMember,
      1100
    );
  }
}



/* ==========================================================
   ACTIVITIES
   ========================================================== */

function renderActivities() {

  const grid =
    document
      .getElementById(
        'activityGrid'
      );


  grid.innerHTML =
    '';


  state.activities.forEach(
    function(activity) {

      const button =
        document.createElement(
          'button'
        );


      button.type =
        'button';


      button.className =
        'activity';


      button.dataset.id =
        activity.activityId;


      button.innerHTML =

        '<span class="activity-icon">' +

        getActivityIcon(
          activity
        ) +

        '</span>' +

        escapeHtml(
          activity.activityName
        ) +

        '<span class="activity-point">' +

        (
          activity.activityType ===
          'HEALTH_CHECK'

            ? 'รออนุมัติ +' +
              Number(
                activity.point || 0
              ) +
              ' คะแนน'

            : '+' +
              Number(
                activity.point || 0
              ) +
              ' คะแนน'
        ) +

        '</span>';


      button.onclick =
        function() {

          selectActivity(
            activity.activityId
          );

        };


      grid.appendChild(
        button
      );

    }
  );
}



function selectActivity(
  id
) {

  state.selectedActivity =
    id;


  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(
      function(button) {

        button
          .classList
          .toggle(

            'selected',

            button.dataset.id ===
            id

          );

      }
    );
}



function getActivityIcon(
  activity
) {

  if (
    activity.icon
  ) {

    return activity.icon;
  }


  const name =
    String(
      activity.activityName || ''
    );


  if (
    name.includes('เดิน')
  ) {

    return '🚶';
  }


  if (
    name.includes('วิ่ง')
  ) {

    return '🏃';
  }


  if (
    name.includes('ปั่น')
  ) {

    return '🚲';
  }


  if (
    name.includes('แอโรบิค')
  ) {

    return '🎵';
  }


  if (
    name.includes('สนาม')
  ) {

    return '🛝';
  }


  if (
    activity.activityType ===
    'HEALTH_CHECK'
  ) {

    return '❤️';
  }


  return '●';
}



/* ==========================================================
   PHOTO
   ========================================================== */

function openPhoto() {

  const input =
    document.getElementById(
      'photoInput'
    );


  input.value =
    '';


  input.click();
}



async function onPhotoSelected(
  event
) {

  const file =
    event &&
    event.target &&
    event.target.files
      ? event.target.files[0]
      : null;


  if (!file) {

    return;
  }


  showLoading(
    'กำลังเตรียมภาพ...'
  );


  try {

    /*
     * Fast Mode:
     * 500px / quality 0.58
     */
    state.photo =
      await resizePhoto(
        file,
        500,
        500,
        .58
      );


    const preview =
      document.getElementById(
        'photoPreview'
      );


    preview.src =
      state.photo;


    preview
      .classList
      .remove(
        'hidden'
      );


    hideLoading();


    setStatus(
      'พร้อมยืนยัน'
    );


  } catch (error) {

    hideLoading();


    setStatus(
      'เตรียมภาพไม่สำเร็จ',
      true
    );
  }
}



function resizePhoto(
  file,
  maxWidth,
  maxHeight,
  quality
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const image =
            new Image();


          image.onload =
            function() {

              const ratio =
                Math.min(

                  1,

                  maxWidth /
                    image.width,

                  maxHeight /
                    image.height

                );


              const width =
                Math.max(
                  1,
                  Math.round(
                    image.width *
                    ratio
                  )
                );


              const height =
                Math.max(
                  1,
                  Math.round(
                    image.height *
                    ratio
                  )
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const context =
                canvas.getContext(
                  '2d'
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  quality
                )
              );
            };


          image.onerror =
            reject;


          image.src =
            event.target.result;
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );
    }
  );
}



/* ==========================================================
   CONFIRM
   ========================================================== */

async function confirmCheckin() {

  if (
    !state.selectedActivity
  ) {

    setStatus(
      'กรุณาเลือกกิจกรรม',
      true
    );

    return;
  }


  if (
    !state.photo
  ) {

    setStatus(
      'กรุณาถ่ายภาพ',
      true
    );

    return;
  }


  const button =
    document.getElementById(
      'confirmButton'
    );


  button.disabled =
    true;


  showLoading(
    'กำลังบันทึก...'
  );


  try {

    const result =
      await callApi(
        'CHECKIN',
        {

          scannedQr:
            state.scannedQr,

          activityId:
            state.selectedActivity,

          photoDataUrl:
            state.photo

        }
      );


    hideLoading();


    document
      .getElementById(
        'successDetail'
      )
      .textContent =

        result.approvalStatus ===
        'PENDING'

          ? 'บันทึกแล้ว • รออนุมัติคะแนน'

          : '+' +
            Number(
              result.pointAwarded || 0
            ) +
            ' คะแนน • รวม ' +
            Number(
              result.totalPoints || 0
            ) +
            ' คะแนน';


    document
      .getElementById(
        'success'
      )
      .classList
      .remove(
        'hidden'
      );


    /*
     * กลับกล้องเร็ว
     */
    setTimeout(
      resetForNextMember,
      800
    );


  } catch (error) {

    hideLoading();


    button.disabled =
      false;


    setStatus(
      error.message,
      true
    );
  }
}



/* ==========================================================
   RESET
   ========================================================== */

async function resetForNextMember() {

  document
    .getElementById(
      'success'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'memberSection'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'cameraSection'
    )
    .classList
    .remove(
      'hidden'
    );


  state.locked =
    false;


  state.scannedQr =
    '';


  state.member =
    null;


  state.selectedActivity =
    '';


  state.photo =
    '';


  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(
      function(button) {

        button
          .classList
          .remove(
            'selected'
          );

      }
    );


  const image =
    document.getElementById(
      'photoPreview'
    );


  image.src =
    '';


  image
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'photoInput'
    )
    .value =
      '';


  document
    .getElementById(
      'confirmButton'
    )
    .disabled =
      false;


  setStatus(
    'พร้อมสแกนสมาชิก'
  );


  await startCamera();
}



/* ==========================================================
   UI
   ========================================================== */

function setStatus(
  message,
  error
) {

  const box =
    document.getElementById(
      'status'
    );


  box.textContent =
    message;


  box.className =
    error
      ? 'error'
      : '';
}



function showLoading(
  message
) {

  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      message;


  document
    .getElementById(
      'loading'
    )
    .classList
    .remove(
      'hidden'
    );
}



function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList
    .add(
      'hidden'
    );
}



function escapeHtml(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#39;'
    );
}

</script>
