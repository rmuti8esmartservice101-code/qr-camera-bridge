<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>พกสุข ส่วนกลาง</title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>
    :root {
      --primary: #147d73;
      --primary-dark: #0e625a;
      --soft: #eaf7f5;

      --bg: #f6f7f7;
      --white: #ffffff;

      --text: #172221;
      --muted: #788381;
      --border: #e2e7e6;

      --green: #198754;
      --red: #d94646;

      --shadow:
        0 5px 22px
        rgba(20, 125, 115, .06);
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;

      min-height: 100%;
    }


    body {
      min-height: 100vh;

      background: var(--bg);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    button,
    input {
      font: inherit;
    }


    .hidden {
      display: none !important;
    }


    .app {
      width: min(100%, 660px);

      margin: 0 auto;

      padding-bottom:
        calc(
          30px +
          env(safe-area-inset-bottom)
        );
    }


    /* ===============================
       HEADER
       =============================== */

    .header {
      display: flex;

      align-items: center;

      gap: 10px;

      padding:
        calc(
          12px +
          env(safe-area-inset-top)
        )
        15px
        12px;

      background: white;

      border-bottom:
        1px solid var(--border);
    }


    .logo {
      width: 40px;
      height: 40px;

      display: grid;

      place-items: center;

      border-radius: 12px;

      background: var(--primary);

      color: white;

      font-size: 21px;
    }


    .brand {
      font-size: 16px;

      font-weight: 900;
    }


    .brand-sub {
      margin-top: 2px;

      font-size: 11px;

      color: var(--muted);
    }


    /* ===============================
       CONTENT
       =============================== */

    .content {
      padding: 12px;
    }


    .card {
      margin-bottom: 11px;

      padding: 15px;

      background: white;

      border:
        1px solid var(--border);

      border-radius: 18px;

      box-shadow:
        var(--shadow);
    }


    .title {
      margin: 0;

      font-size: 19px;

      font-weight: 900;
    }


    .subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.45;
    }


    /* ===============================
       CAMERA
       =============================== */

    #reader {
      overflow: hidden;

      width: 100%;

      margin-top: 13px;

      background: #101827;

      border-radius: 17px;
    }


    #reader video {
      width: 100% !important;

      border-radius: 17px;
    }


    .scan-text {
      margin-top: 10px;

      color: var(--muted);

      font-size: 12px;

      text-align: center;
    }


    .button {
      width: 100%;

      min-height: 50px;

      margin-top: 10px;

      border: 0;

      border-radius: 14px;

      font-weight: 900;
    }


    .primary {
      background: var(--primary);

      color: white;
    }


    .soft {
      background: var(--soft);

      color: var(--primary-dark);

      border:
        1px solid #cdeae7;
    }


    /* ===============================
       MEMBER
       =============================== */

    .member-name {
      font-size: 22px;

      font-weight: 900;
    }


    .member-code {
      margin-top: 3px;

      color: var(--muted);

      font-size: 12px;
    }


    .stats {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;

      margin-top: 14px;
    }


    .stat {
      padding: 13px;

      background: #f8faf9;

      border:
        1px solid var(--border);

      border-radius: 14px;
    }


    .stat-label {
      color: var(--muted);

      font-size: 11px;
    }


    .stat-value {
      margin-top: 3px;

      font-size: 22px;

      font-weight: 900;
    }


    /* ===============================
       ACTIVITIES
       =============================== */

    .activity-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 13px;
    }


    .activity {
      min-height: 72px;

      padding: 10px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: white;

      color: var(--text);

      font-weight: 800;

      text-align: left;
    }


    .activity-icon {
      display: block;

      margin-bottom: 4px;

      font-size: 22px;
    }


    .activity-points {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;

      font-weight: 600;
    }


    .activity.selected {
      border-color:
        var(--primary);

      background:
        var(--soft);

      color:
        var(--primary-dark);

      box-shadow:
        inset 0 0 0 1px
        var(--primary);
    }


    /* ===============================
       PHOTO
       =============================== */

    #photoInput {
      display: none;
    }


    .photo-preview {
      width: 100%;

      max-height: 320px;

      margin-top: 10px;

      border-radius: 15px;

      object-fit: cover;
    }


    /* ===============================
       SUCCESS
       =============================== */

    .success-overlay {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(
          246,
          247,
          247,
          .96
        );
    }


    .success-card {
      width: min(100%, 360px);

      padding: 28px 20px;

      background: white;

      border-radius: 22px;

      text-align: center;

      box-shadow:
        0 15px 50px
        rgba(
          0,
          0,
          0,
          .12
        );
    }


    .success-icon {
      font-size: 55px;
    }


    .success-title {
      margin-top: 8px;

      color: var(--green);

      font-size: 23px;

      font-weight: 900;
    }


    .success-detail {
      margin-top: 6px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;
    }


    /* ===============================
       STATUS
       =============================== */

    .status {
      margin-top: 10px;

      padding: 10px 12px;

      border-radius: 12px;

      background: #f8faf9;

      color: var(--muted);

      font-size: 12px;

      text-align: center;
    }


    .status.error {
      background: #fff0f0;

      color: var(--red);
    }


    /* ===============================
       LOADING
       =============================== */

    .loading {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(
          255,
          255,
          255,
          .83
        );
    }


    .loading-box {
      padding: 17px 22px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 10px 35px
        rgba(
          0,
          0,
          0,
          .12
        );

      font-weight: 800;
    }


    /* hidden backend iframe */

    #bridgeFrame {
      position: fixed;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;

      border: 0;
    }
  </style>
</head>


<body>


<iframe
  id="bridgeFrame"
  title="Backend Bridge">
</iframe>


<div
  id="loading"
  class="loading hidden">

  <div
    id="loadingText"
    class="loading-box">
    กำลังทำงาน...
  </div>

</div>


<div
  id="successOverlay"
  class="success-overlay hidden">

  <div class="success-card">

    <div class="success-icon">
      ✓
    </div>


    <div class="success-title">
      ลงทะเบียนสำเร็จ
    </div>


    <div
      id="successDetail"
      class="success-detail">
    </div>

  </div>

</div>


<div class="app">

  <header class="header">

    <div class="logo">
      ♥
    </div>

    <div>

      <div class="brand">
        ระบบพกสุข
      </div>

      <div class="brand-sub">
        เครื่องสแกนส่วนกลาง
      </div>

    </div>

  </header>


  <main class="content">


    <!-- ===========================
         CAMERA
         =========================== -->

    <section
      id="cameraCard"
      class="card">

      <h1 class="title">
        สแกนสมาชิก
      </h1>


      <div class="subtitle">
        นำ QR Code มาไว้ในกรอบ
      </div>


      <div id="reader">
      </div>


      <button
        id="startCameraButton"
        class="button primary hidden"
        onclick="startCamera()">

        เปิดกล้อง

      </button>


      <div
        id="scanStatus"
        class="scan-text">

        กำลังเตรียมระบบ...

      </div>

    </section>


    <!-- ===========================
         MEMBER
         =========================== -->

    <section
      id="memberArea"
      class="hidden">


      <div class="card">

        <div
          id="memberName"
          class="member-name">
        </div>


        <div
          id="memberCode"
          class="member-code">
        </div>


        <div class="stats">

          <div class="stat">

            <div class="stat-label">
              คะแนนสะสม
            </div>

            <div
              id="memberPoints"
              class="stat-value">

              0

            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              ลำดับ
            </div>

            <div
              id="memberRank"
              class="stat-value">

              -

            </div>

          </div>

        </div>

      </div>


      <!-- ACTIVITIES -->

      <div class="card">

        <h2 class="title">
          เลือกกิจกรรม
        </h2>


        <div
          id="activityGrid"
          class="activity-grid">
        </div>

      </div>


      <!-- PHOTO -->

      <div class="card">

        <h2 class="title">
          ภาพกิจกรรม
        </h2>


        <div class="subtitle">
          ถ่ายภาพก่อนยืนยัน
        </div>


        <button
          class="button soft"
          onclick="openPhotoCamera()">

          📷 ถ่ายภาพ

        </button>


        <input
          id="photoInput"
          type="file"
          accept="image/*"
          capture="environment"
          onchange="handlePhoto(event)">


        <img
          id="photoPreview"
          class="photo-preview hidden"
          alt="ภาพกิจกรรม">


        <button
          id="confirmButton"
          class="button primary"
          onclick="confirmCheckin()">

          ยืนยันการลงทะเบียน

        </button>

      </div>

    </section>


    <div
      id="statusBox"
      class="status">

      กำลังเชื่อมต่อฐานข้อมูล...

    </div>

  </main>

</div>


<script>
  /* =======================================================
     CONFIG
     ======================================================= */

  const GITHUB_ORIGIN =
    window.location.origin;


  const params =
    new URLSearchParams(
      window.location.search
    );


  let backendUrl =
    String(
      params.get(
        'backend'
      ) || ''
    ).trim();


  if (
    backendUrl
  ) {
    localStorage.setItem(
      'POKSUK_BACKEND_URL',
      backendUrl
    );
  }


  if (
    !backendUrl
  ) {
    backendUrl =
      localStorage.getItem(
        'POKSUK_BACKEND_URL'
      ) || '';
  }


  /* =======================================================
     STATE
     ======================================================= */

  const state = {
    bridgeReady:
      false,

    scanner:
      null,

    cameraRunning:
      false,

    scanLocked:
      false,

    scannedQr:
      '',

    member:
      null,

    activities:
      [],

    selectedActivityId:
      '',

    photoDataUrl:
      '',

    thumbDataUrl:
      ''
  };


  const pending =
    new Map();


  /* =======================================================
     INIT
     ======================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  function init() {
    if (
      !backendUrl
    ) {
      showStatus(
        'กรุณาเปิดเครื่องสแกนจาก /exec?page=central ก่อน',
        true
      );


      return;
    }


    const bridgeUrl =
      backendUrl
        .split('?')[0] +
      '?page=centralbridge';


    document
      .getElementById(
        'bridgeFrame'
      )
      .src =
        bridgeUrl;
  }


  /* =======================================================
     BRIDGE
     ======================================================= */

  window.addEventListener(
    'message',
    function(event) {

      const frame =
        document.getElementById(
          'bridgeFrame'
        );


      if (
        !frame ||
        event.source !==
          frame.contentWindow
      ) {
        return;
      }


      const message =
        event.data;


      if (
        !message ||
        message.channel !==
          'POKSUK_CENTRAL'
      ) {
        return;
      }


      if (
        message.type ===
        'READY'
      ) {
        state.bridgeReady =
          true;


        onBridgeReady();


        return;
      }


      if (
        !message.id ||
        !pending.has(
          message.id
        )
      ) {
        return;
      }


      const request =
        pending.get(
          message.id
        );


      pending.delete(
        message.id
      );


      if (
        message.success
      ) {
        request.resolve(
          message.data
        );

      } else {
        request.reject(
          new Error(
            message.error ||
            'Backend error'
          )
        );
      }

    }
  );


  function callBackend(
    action,
    payload
  ) {
    return new Promise(
      function(
        resolve,
        reject
      ) {
        if (
          !state.bridgeReady
        ) {
          reject(
            new Error(
              'Backend ยังไม่พร้อม'
            )
          );


          return;
        }


        const id =
          crypto.randomUUID
            ? crypto.randomUUID()
            : (
                Date.now() +
                '-' +
                Math.random()
              );


        pending.set(
          id,
          {
            resolve:
              resolve,

            reject:
              reject
          }
        );


        document
          .getElementById(
            'bridgeFrame'
          )
          .contentWindow
          .postMessage(

            {
              channel:
                'POKSUK_CENTRAL',

              id:
                id,

              action:
                action,

              payload:
                payload || {}
            },

            '*'
          );
      }
    );
  }


  async function onBridgeReady() {
    try {
      showStatus(
        'พร้อมใช้งาน'
      );


      const result =
        await callBackend(
          'ACTIVITIES'
        );


      state.activities =
        Array.isArray(
          result.activities
        )
          ? result.activities
          : [];


      renderActivities();


      await startCamera();


    } catch (error) {
      showStatus(
        error.message,
        true
      );
    }
  }


  /* =======================================================
     CAMERA
     ======================================================= */

  async function startCamera() {
    if (
      state.cameraRunning
    ) {
      return;
    }


    state.scanLocked =
      false;


    document
      .getElementById(
        'startCameraButton'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'scanStatus'
      )
      .textContent =
        'กำลังเปิดกล้อง...';


    try {
      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length ===
          0
      ) {
        throw new Error(
          'ไม่พบกล้อง'
        );
      }


      let selected =
        cameras[
          cameras.length - 1
        ];


      const rear =
        cameras.find(
          function(camera) {
            const label =
              String(
                camera.label || ''
              )
                .toLowerCase();


            return (
              label.includes(
                'back'
              ) ||
              label.includes(
                'rear'
              ) ||
              label.includes(
                'environment'
              )
            );
          }
        );


      if (rear) {
        selected =
          rear;
      }


      state.scanner =
        new Html5Qrcode(
          'reader'
        );


      await state
        .scanner
        .start(

          selected.id,

          {
            fps:
              10,

            qrbox:
              function(
                width,
                height
              ) {
                const size =
                  Math.floor(
                    Math.min(
                      width,
                      height
                    ) *
                    .70
                  );


                return {
                  width:
                    size,

                  height:
                    size
                };
              }
          },

          onQrDetected,

          function() {}
        );


      state.cameraRunning =
        true;


      document
        .getElementById(
          'scanStatus'
        )
        .textContent =
          'พร้อมสแกนสมาชิก';


    } catch (error) {
      state.cameraRunning =
        false;


      document
        .getElementById(
          'startCameraButton'
        )
        .classList
        .remove(
          'hidden'
        );


      showStatus(
        'เปิดกล้องไม่สำเร็จ: ' +
        (
          error.message ||
          error
        ),
        true
      );
    }
  }


  async function stopCamera() {
    if (
      !state.scanner
    ) {
      state.cameraRunning =
        false;


      return;
    }


    try {
      if (
        state.cameraRunning
      ) {
        await state
          .scanner
          .stop();
      }

    } catch (error) {
      console.log(
        error
      );
    }


    try {
      state
        .scanner
        .clear();

    } catch (error) {
      console.log(
        error
      );
    }


    state.scanner =
      null;


    state.cameraRunning =
      false;
  }


  async function onQrDetected(
    decodedText
  ) {
    if (
      state.scanLocked ||
      !decodedText
    ) {
      return;
    }


    state.scanLocked =
      true;


    state.scannedQr =
      String(
        decodedText
      ).trim();


    await stopCamera();


    await lookupMember();
  }


  /* =======================================================
     MEMBER
     ======================================================= */

  async function lookupMember() {
    showLoading(
      'กำลังตรวจสอบสมาชิก...'
    );


    try {
      const result =
        await callBackend(

          'PREVIEW',

          {
            scannedQr:
              state.scannedQr
          }
        );


      state.member =
        result;


      renderMember();


      hideLoading();


      document
        .getElementById(
          'cameraCard'
        )
        .classList
        .add(
          'hidden'
        );


      document
        .getElementById(
          'memberArea'
        )
        .classList
        .remove(
          'hidden'
        );


      showStatus(
        'เลือกกิจกรรมและถ่ายภาพ'
      );


    } catch (error) {
      hideLoading();


      showStatus(
        error.message,
        true
      );


      resetAndScanAgain(
        900
      );
    }
  }


  function renderMember() {
    document
      .getElementById(
        'memberName'
      )
      .textContent =
        state.member
          .fullName ||
        '-';


    document
      .getElementById(
        'memberCode'
      )
      .textContent =
        state.member
          .memberId ||
        '';


    document
      .getElementById(
        'memberPoints'
      )
      .textContent =
        Number(
          state.member
            .totalPoints ||
          0
        );


    document
      .getElementById(
        'memberRank'
      )
      .textContent =
        state.member
          .currentRank
            ? (
                '#' +
                state.member
                  .currentRank
              )
            : '-';
  }


  /* =======================================================
     ACTIVITIES
     ======================================================= */

  function renderActivities() {
    const grid =
      document.getElementById(
        'activityGrid'
      );


    grid.innerHTML =
      '';


    state.activities.forEach(
      function(activity) {

        const button =
          document.createElement(
            'button'
          );


        button.type =
          'button';


        button.className =
          'activity';


        button.dataset.activityId =
          activity.activityId;


        button.innerHTML =
          '<span class="activity-icon">' +
          activityIcon(
            activity
          ) +
          '</span>' +

          escapeHtml(
            activity.activityName
          ) +

          '<span class="activity-points">' +

          (
            activity.activityType ===
            'HEALTH_CHECK'
              ? 'รออนุมัติ +2 คะแนน'
              : (
                  '+' +
                  activity.point +
                  ' คะแนน'
                )
          ) +

          '</span>';


        button.addEventListener(
          'click',
          function() {

            selectActivity(
              activity.activityId
            );

          }
        );


        grid.appendChild(
          button
        );
      }
    );
  }


  function activityIcon(
    activity
  ) {
    if (
      activity.icon
    ) {
      return activity.icon;
    }


    const name =
      String(
        activity.activityName ||
        ''
      );


    if (
      name.includes(
        'เดิน'
      )
    ) {
      return '🚶';
    }


    if (
      name.includes(
        'วิ่ง'
      )
    ) {
      return '🏃';
    }


    if (
      name.includes(
        'ปั่น'
      )
    ) {
      return '🚲';
    }


    if (
      name.includes(
        'แอโรบิค'
      )
    ) {
      return '💃';
    }


    if (
      activity.activityType ===
      'HEALTH_CHECK'
    ) {
      return '🩺';
    }


    return '●';
  }


  function selectActivity(
    activityId
  ) {
    state.selectedActivityId =
      activityId;


    document
      .querySelectorAll(
        '.activity'
      )
      .forEach(
        function(button) {

          button
            .classList
            .toggle(

              'selected',

              button.dataset
                .activityId ===
                activityId
            );

        }
      );
  }


  /* =======================================================
     PHOTO
     ======================================================= */

  function openPhotoCamera() {
    const input =
      document.getElementById(
        'photoInput'
      );


    input.value =
      '';


    input.click();
  }


  async function handlePhoto(
    event
  ) {
    const file =
      event &&
      event.target &&
      event.target.files
        ? event.target.files[0]
        : null;


    if (!file) {
      return;
    }


    showLoading(
      'กำลังเตรียมภาพ...'
    );


    try {
      state.photoDataUrl =
        await resizeImage(
          file,
          600,
          600,
          .65
        );


      state.thumbDataUrl =
        await resizeImage(
          file,
          180,
          180,
          .70
        );


      const preview =
        document.getElementById(
          'photoPreview'
        );


      preview.src =
        state.photoDataUrl;


      preview.classList.remove(
        'hidden'
      );


      hideLoading();


    } catch (error) {
      hideLoading();


      showStatus(
        'ไม่สามารถเตรียมภาพได้',
        true
      );
    }
  }


  function resizeImage(
    file,
    maxWidth,
    maxHeight,
    quality
  ) {
    return new Promise(
      function(
        resolve,
        reject
      ) {

        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            const image =
              new Image();


            image.onload =
              function() {

                let width =
                  image.width;


                let height =
                  image.height;


                const scale =
                  Math.min(
                    1,
                    maxWidth /
                      width,
                    maxHeight /
                      height
                  );


                width =
                  Math.round(
                    width *
                    scale
                  );


                height =
                  Math.round(
                    height *
                    scale
                  );


                const canvas =
                  document.createElement(
                    'canvas'
                  );


                canvas.width =
                  width;


                canvas.height =
                  height;


                canvas
                  .getContext(
                    '2d'
                  )
                  .drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                  );


                resolve(
                  canvas.toDataURL(
                    'image/jpeg',
                    quality
                  )
                );
              };


            image.onerror =
              reject;


            image.src =
              event.target.result;
          };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );

      }
    );
  }


  /* =======================================================
     CONFIRM
     ======================================================= */

  async function confirmCheckin() {
    if (
      !state.selectedActivityId
    ) {
      showStatus(
        'กรุณาเลือกกิจกรรม',
        true
      );


      return;
    }


    if (
      !state.photoDataUrl
    ) {
      showStatus(
        'กรุณาถ่ายภาพ',
        true
      );


      return;
    }


    showLoading(
      'กำลังบันทึก...'
    );


    document
      .getElementById(
        'confirmButton'
      )
      .disabled =
        true;


    try {
      const result =
        await callBackend(

          'CHECKIN',

          {
            scannedQr:
              state.scannedQr,

            activityId:
              state.selectedActivityId,

            photoDataUrl:
              state.photoDataUrl,

            thumbDataUrl:
              state.thumbDataUrl
          }
        );


      hideLoading();


      showSuccess(
        result
      );


      setTimeout(
        function() {

          resetAndScanAgain(
            0
          );

        },
        1200
      );


    } catch (error) {
      hideLoading();


      document
        .getElementById(
          'confirmButton'
        )
        .disabled =
          false;


      showStatus(
        error.message,
        true
      );
    }
  }


  /* =======================================================
     RESET
     ======================================================= */

  async function resetAndScanAgain(
    delay
  ) {
    setTimeout(
      async function() {

        document
          .getElementById(
            'successOverlay'
          )
          .classList
          .add(
            'hidden'
          );


        document
          .getElementById(
            'memberArea'
          )
          .classList
          .add(
            'hidden'
          );


        document
          .getElementById(
            'cameraCard'
          )
          .classList
          .remove(
            'hidden'
          );


        state.scanLocked =
          false;


        state.scannedQr =
          '';


        state.member =
          null;


        state.selectedActivityId =
          '';


        state.photoDataUrl =
          '';


        state.thumbDataUrl =
          '';


        document
          .querySelectorAll(
            '.activity'
          )
          .forEach(
            function(button) {

              button.classList.remove(
                'selected'
              );

            }
          );


        const preview =
          document.getElementById(
            'photoPreview'
          );


        preview.src =
          '';


        preview.classList.add(
          'hidden'
        );


        document
          .getElementById(
            'photoInput'
          )
          .value =
            '';


        document
          .getElementById(
            'confirmButton'
          )
          .disabled =
            false;


        showStatus(
          'พร้อมสแกนสมาชิก'
        );


        await startCamera();

      },

      delay ||
      0
    );
  }


  /* =======================================================
     SUCCESS
     ======================================================= */

  function showSuccess(
    result
  ) {
    const detail =
      document.getElementById(
        'successDetail'
      );


    if (
      result.approvalStatus ===
      'PENDING'
    ) {
      detail.textContent =
        'บันทึกกิจกรรมแล้ว • รออนุมัติคะแนน';

    } else {
      detail.textContent =
        '+' +
        Number(
          result.pointAwarded ||
          0
        ) +
        ' คะแนน • คะแนนรวม ' +
        Number(
          result.totalPoints ||
          0
        );
    }


    document
      .getElementById(
        'successOverlay'
      )
      .classList
      .remove(
        'hidden'
      );
  }


  /* =======================================================
     STATUS / LOADING
     ======================================================= */

  function showStatus(
    message,
    error
  ) {
    const box =
      document.getElementById(
        'statusBox'
      );


    box.textContent =
      message;


    box.className =
      error
        ? 'status error'
        : 'status';
  }


  function showLoading(
    message
  ) {
    document
      .getElementById(
        'loadingText'
      )
      .textContent =
        message;


    document
      .getElementById(
        'loading'
      )
      .classList
      .remove(
        'hidden'
      );
  }


  function hideLoading() {
    document
      .getElementById(
        'loading'
      )
      .classList
      .add(
        'hidden'
      );
  }


  function escapeHtml(
    value
  ) {
    return String(
      value || ''
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#39;'
      );
  }
</script>
