<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#10271A">

<title>
  QR Activity Camera
</title>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  min-height: 100%;

  background:
    #10271A;

}


body {

  min-height:
    100vh;

  min-height:
    100dvh;

  padding:
    max(
      18px,
      env(safe-area-inset-top)
    )
    18px
    max(
      25px,
      env(safe-area-inset-bottom)
    );

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}


main {

  width:
    min(
      620px,
      100%
    );

  margin: auto;

}


h1 {

  margin:
    12px 0 22px;

  text-align: center;

  font-size:
    clamp(
      25px,
      7vw,
      34px
    );

}


.cameraBox {

  position: relative;

  width: 100%;

  aspect-ratio:
    3 / 4;

  max-height:
    68vh;

  overflow: hidden;

  background:
    #020B05;

  border-radius:
    30px;

}


video {

  width: 100%;

  height: 100%;

  display: block;

  object-fit: cover;

  background:
    #020B05;

}


.scanFrame {

  width:
    min(
      68vw,
      300px
    );

  height:
    min(
      68vw,
      300px
    );

  position: absolute;

  left: 50%;

  top: 50%;

  transform:
    translate(
      -50%,
      -50%
    );

  border:
    5px solid
    #A6E5B3;

  border-radius:
    28px;

  box-shadow:
    0 0 0 1000px
    rgba(
      0,
      0,
      0,
      .15
    );

  pointer-events: none;

}


.status {

  min-height: 54px;

  margin-top: 18px;

  padding: 12px;

  text-align: center;

  color:
    #DDEAE1;

  line-height: 1.5;

}


.error {
  color: #FFB6B6;
}


.success {
  color: #A6E5B3;
}


button,
.fileButton {

  width: 100%;

  margin-top: 10px;

  padding: 15px;

  display: block;

  border: 0;

  border-radius: 15px;

  color:
    #23462E;

  text-align: center;

  text-decoration: none;

  background:
    #A6E5B3;

  font: inherit;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;

}


.secondary {

  color:
    #DDEAE1;

  background:
    #254634;

  border:
    1px solid
    #436C50;

}


.tip {

  margin-top: 15px;

  color:
    #9FB6A6;

  text-align: center;

  font-size: 13px;

  line-height: 1.6;

}


#qrFile {
  display: none;
}

</style>

</head>


<body>


<main>


<h1>
  ▣ สแกน QR Code
</h1>


<div class="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div class="scanFrame">
  </div>

</div>


<div
  id="status"
  class="status">

  กำลังเปิดกล้อง...

</div>


<button
  id="retry"
  type="button"
  hidden>

  เปิดกล้องอีกครั้ง

</button>


<label
  class="fileButton secondary"
  for="qrFile">

  🖼️ อ่าน QR จากรูปภาพ

</label>


<input
  id="qrFile"
  type="file"
  accept="image/*">


<div class="tip">

  นำ QR Code ให้อยู่ในกรอบ
  <br>

  หากกล้องอ่านไม่ได้ สามารถใช้
  “อ่าน QR จากรูปภาพ” ได้

</div>


</main>


<script type="module">

import QrScanner from
  'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


const params =
  new URLSearchParams(
    window.location.search
  );


const RETURN_URL =
  params.get(
    'returnUrl'
  ) || '';


const video =
  document.getElementById(
    'video'
  );


const statusBox =
  document.getElementById(
    'status'
  );


const retry =
  document.getElementById(
    'retry'
  );


const qrFile =
  document.getElementById(
    'qrFile'
  );


let scanner =
  null;


let completed =
  false;


/************************************************************
 * RETURN URL SECURITY
 ************************************************************/

function getReturnUrl() {

  if (!RETURN_URL) {
    return null;
  }


  try {

    const url =
      new URL(
        RETURN_URL
      );


    /*
     * Apps Script production URL
     */

    if (
      url.protocol !==
      'https:'
    ) {

      return null;
    }


    if (
      url.hostname !==
      'script.google.com'
    ) {

      return null;
    }


    if (
      !url.pathname.includes(
        '/macros/s/'
      )
    ) {

      return null;
    }


    return url;


  } catch (error) {

    return null;

  }

}


/************************************************************
 * COMPLETE SCAN
 ************************************************************/

async function completeScan(value) {

  if (completed) {
    return;
  }


  value =
    String(
      value || ''
    ).trim();


  if (!value) {
    return;
  }


  completed =
    true;


  try {

    if (scanner) {

      await scanner.stop();

    }

  } catch (error) {}


  statusBox.classList.remove(
    'error'
  );

  statusBox.classList.add(
    'success'
  );

  statusBox.textContent =
    '✓ อ่าน QR Code สำเร็จ กำลังกลับเข้าสู่ระบบ...';


  const destination =
    getReturnUrl();


  if (!destination) {

    showError(
      'URL กลับเข้าสู่ระบบไม่ถูกต้อง'
    );

    completed =
      false;

    return;
  }


  destination.searchParams.set(
    'scan',
    value
  );


  setTimeout(
    () => {

      /*
       * จุดสำคัญ Version 4.1
       *
       * Redirect กลับ Apps Script
       * ไม่ใช้ window.opener
       */

      window.location.replace(
        destination.toString()
      );

    },
    350
  );

}


/************************************************************
 * START CAMERA
 ************************************************************/

async function startCamera() {

  completed =
    false;


  retry.hidden =
    true;


  statusBox.classList.remove(
    'error',
    'success'
  );


  statusBox.textContent =
    'กำลังเปิดกล้อง...';


  if (!getReturnUrl()) {

    showError(
      'ไม่พบ URL สำหรับกลับเข้าสู่ระบบ กรุณาเปิดกล้องจากหน้า Web App'
    );

    return;
  }


  try {

    if (scanner) {

      scanner.destroy();

      scanner =
        null;

    }


    const hasCamera =
      await QrScanner.hasCamera();


    if (!hasCamera) {

      throw new Error(
        'ไม่พบกล้องในอุปกรณ์'
      );

    }


    scanner =
      new QrScanner(

        video,

        result => {

          const value =
            typeof result ===
            'string'

              ? result

              : result.data;


          if (value) {

            completeScan(
              value
            );

          }

        },

        {

          preferredCamera:
            'environment',

          maxScansPerSecond:
            20,

          highlightScanRegion:
            false,

          highlightCodeOutline:
            true,

          returnDetailedScanResult:
            true

        }

      );


    /*
     * รองรับกรณี QR สี/กลับสี
     */

    scanner.setInversionMode(
      'both'
    );


    await scanner.start();


    statusBox.textContent =
      'พร้อมสแกน • นำ QR Code เข้ากรอบ';


  } catch (error) {

    console.error(error);

    showError(
      cameraErrorText(
        error
      )
    );

  }

}


/************************************************************
 * IMAGE QR FALLBACK
 ************************************************************/

qrFile.addEventListener(
  'change',
  async event => {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    statusBox.classList.remove(
      'error',
      'success'
    );


    statusBox.textContent =
      'กำลังอ่าน QR จากรูปภาพ...';


    try {

      const result =
        await QrScanner.scanImage(

          file,

          {

            returnDetailedScanResult:
              true,

            alsoTryWithoutScanRegion:
              true

          }

        );


      const value =
        typeof result ===
        'string'

          ? result

          : result.data;


      if (!value) {

        throw new Error(
          'ไม่พบ QR Code ในภาพ'
        );

      }


      completeScan(
        value
      );


    } catch (error) {

      console.error(error);

      showError(
        'อ่าน QR จากภาพไม่สำเร็จ กรุณาถ่ายให้ QR ชัดและเต็มภาพ'
      );

    }


    event.target.value =
      '';

  }
);


/************************************************************
 * CAMERA ERROR
 ************************************************************/

function cameraErrorText(error) {

  const name =
    error &&
    error.name
      ? error.name
      : '';


  if (
    name ===
    'NotAllowedError'
  ) {

    return (
      'ไม่ได้รับอนุญาตใช้กล้อง กรุณาเปิดสิทธิ์ Camera แล้วกดลองใหม่'
    );

  }


  if (
    name ===
    'NotFoundError'
  ) {

    return (
      'ไม่พบกล้องในอุปกรณ์'
    );

  }


  if (
    name ===
    'NotReadableError'
  ) {

    return (
      'กล้องไม่พร้อมใช้งาน อาจถูกแอปอื่นใช้งานอยู่'
    );

  }


  if (
    name ===
    'OverconstrainedError'
  ) {

    return (
      'ไม่สามารถเลือกกล้องที่ต้องการได้'
    );

  }


  return (
    error &&
    error.message
      ? error.message
      : String(error)
  );

}


function showError(message) {

  statusBox.classList.remove(
    'success'
  );

  statusBox.classList.add(
    'error'
  );

  statusBox.textContent =
    message;

  retry.hidden =
    false;

}


/************************************************************
 * RETRY
 ************************************************************/

retry.addEventListener(
  'click',
  startCamera
);


/************************************************************
 * CLEANUP
 ************************************************************/

window.addEventListener(
  'pagehide',
  () => {

    try {

      if (scanner) {
        scanner.destroy();
      }

    } catch (error) {}

  }
);


/************************************************************
 * START
 ************************************************************/

startCamera();

</script>


</body>
</html>
