<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#10271A">

<title>
  QR Activity Camera V5
</title>


<style>

* {
  box-sizing:
    border-box;
}


html,
body {

  margin:
    0;

  min-height:
    100%;

  background:
    #10271A;

}


body {

  min-height:
    100vh;

  min-height:
    100dvh;

  padding:

    max(
      18px,
      env(
        safe-area-inset-top
      )
    )

    18px

    max(
      25px,
      env(
        safe-area-inset-bottom
      )
    );

  color:
    white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans Thai",
    sans-serif;

}


main {

  width:
    min(
      620px,
      100%
    );

  margin:
    auto;

}


.logo {

  text-align:
    center;

  color:
    #A6E5B3;

  font-size:
    13px;

  font-weight:
    700;

  letter-spacing:
    1px;

}


h1 {

  margin:
    10px 0 22px;

  text-align:
    center;

  font-size:
    clamp(
      27px,
      7vw,
      36px
    );

}


.cameraBox {

  width:
    100%;

  aspect-ratio:
    3 / 4;

  max-height:
    67vh;

  position:
    relative;

  overflow:
    hidden;

  background:
    #020B05;

  border:
    1px solid
    #244B32;

  border-radius:
    30px;

}


video {

  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    cover;

  background:
    #020B05;

}


.scanFrame {

  width:
    min(
      70vw,
      310px
    );

  height:
    min(
      70vw,
      310px
    );

  position:
    absolute;

  left:
    50%;

  top:
    50%;

  transform:
    translate(
      -50%,
      -50%
    );

  border:
    5px solid
    #A6E5B3;

  border-radius:
    28px;

  box-shadow:
    0 0 0 1000px
    rgba(
      0,
      0,
      0,
      .14
    );

  pointer-events:
    none;

}


.status {

  min-height:
    70px;

  margin-top:
    16px;

  padding:
    12px;

  color:
    #DDEAE1;

  text-align:
    center;

  line-height:
    1.6;

}


.status.error {

  color:
    #FFB6B6;

}


.status.success {

  color:
    #A6E5B3;

}


button,
.fileButton {

  width:
    100%;

  margin-top:
    10px;

  padding:
    15px;

  display:
    block;

  color:
    #23462E;

  background:
    #A6E5B3;

  border:
    0;

  border-radius:
    15px;

  cursor:
    pointer;

  text-align:
    center;

  text-decoration:
    none;

  font:
    inherit;

  font-size:
    16px;

  font-weight:
    700;

}


.secondary {

  color:
    #DDEAE1;

  background:
    #254634;

  border:
    1px solid
    #436C50;

}


.tip {

  margin-top:
    15px;

  color:
    #9FB6A6;

  text-align:
    center;

  font-size:
    13px;

  line-height:
    1.6;

}


.version {

  margin-top:
    18px;

  color:
    #668171;

  text-align:
    center;

  font-size:
    11px;

}


#qrFile {

  display:
    none;

}

</style>

</head>


<body>


<main>


<div class="logo">
  QR ACTIVITY
</div>


<h1>
  ▣ สแกน QR Code
</h1>


<div class="cameraBox">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div class="scanFrame">
  </div>

</div>


<div
  id="status"
  class="status">

  แตะ “เปิดกล้อง” เพื่อเริ่มสแกน QR Code

</div>


<button
  id="startButton"
  type="button">

  📷 เปิดกล้อง

</button>


<button
  id="retryButton"
  class="secondary"
  type="button"
  hidden>

  ลองเปิดกล้องอีกครั้ง

</button>


<label
  class="fileButton secondary"
  for="qrFile">

  🖼️ อ่าน QR จากรูปภาพ

</label>


<input
  id="qrFile"
  type="file"
  accept="image/*">


<div class="tip">

  นำ QR Code ให้อยู่ในกรอบ
  และถือกล้องให้นิ่ง

  <br><br>

  ถ้ากล้องอ่านไม่ได้
  ให้ถ่ายรูป QR แล้วเลือก
  “อ่าน QR จากรูปภาพ”

</div>


<div class="version">
  Camera Bridge Version 5.0
</div>


</main>


<script type="module">

import QrScanner from
  'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


/***************************************************************
 * ELEMENTS
 ***************************************************************/

const video =
  document.getElementById(
    'video'
  );


const statusBox =
  document.getElementById(
    'status'
  );


const startButton =
  document.getElementById(
    'startButton'
  );


const retryButton =
  document.getElementById(
    'retryButton'
  );


const qrFile =
  document.getElementById(
    'qrFile'
  );


const params =
  new URLSearchParams(
    window.location.search
  );


/*
 * ใช้เป็น fallback เฉพาะ QR เก่าที่เก็บ token ตรง ๆ
 */

const APP_URL =
  params.get(
    'app'
  ) || '';


let scanner =
  null;


let completed =
  false;


/***************************************************************
 * VALIDATE APPS SCRIPT URL
 ***************************************************************/

function validAppsScriptUrl(
  value
) {

  try {

    const url =
      new URL(
        value
      );


    if (
      url.protocol !==
      'https:'
    ) {

      return false;

    }


    if (
      url.hostname !==
      'script.google.com'
    ) {

      return false;

    }


    if (
      !url.pathname.includes(
        '/macros/s/'
      )
    ) {

      return false;

    }


    if (
      !(
        url.pathname.endsWith(
          '/exec'
        ) ||
        url.pathname.endsWith(
          '/dev'
        )
      )
    ) {

      return false;

    }


    return true;


  } catch (error) {

    return false;

  }

}


/***************************************************************
 * PROCESS RESULT
 ***************************************************************/

async function processQr(
  raw
) {

  if (
    completed
  ) {

    return;

  }


  raw =
    String(
      raw || ''
    ).trim();


  if (!raw) {

    return;

  }


  /*
   * CASE 1
   *
   * QR V5:
   * เป็น URL ของ Apps Script อยู่แล้ว
   */

  if (
    validAppsScriptUrl(
      raw
    )
  ) {

    completed =
      true;


    await stopScanner();


    showSuccess(
      '✓ อ่าน QR Code สำเร็จ กำลังเข้าสู่ระบบ...'
    );


    setTimeout(
      () => {

        window.location.assign(
          raw
        );

      },
      300
    );


    return;

  }


  /*
   * CASE 2
   *
   * รองรับ QR Token รุ่นเก่า
   */

  if (
    validAppsScriptUrl(
      APP_URL
    )
  ) {

    /*
     * ไม่ยอมรับข้อความที่ยาวผิดปกติ
     */

    if (
      raw.length >
      500
    ) {

      showError(
        'ข้อมูลใน QR Code ไม่ถูกต้อง'
      );

      return;

    }


    const destination =
      new URL(
        APP_URL
      );


    destination
      .searchParams
      .set(
        'token',
        raw
      );


    completed =
      true;


    await stopScanner();


    showSuccess(
      '✓ อ่าน QR Code สำเร็จ กำลังเข้าสู่ระบบ...'
    );


    setTimeout(
      () => {

        window.location.assign(
          destination.toString()
        );

      },
      300
    );


    return;

  }


  /*
   * QR ไม่ใช่ของระบบ
   */

  showError(
    'QR Code นี้ไม่ใช่ QR ของระบบกิจกรรม'
  );

}


/***************************************************************
 * START SCANNER
 ***************************************************************/

async function startScanner() {

  completed =
    false;


  startButton.hidden =
    true;


  retryButton.hidden =
    true;


  statusBox.className =
    'status';


  statusBox.textContent =
    'กำลังขออนุญาตใช้กล้อง...';


  try {

    /*
     * ปิด instance เก่าก่อน
     */

    if (
      scanner
    ) {

      try {

        scanner.destroy();

      } catch (error) {}


      scanner =
        null;

    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      throw new Error(
        'Browser นี้ไม่รองรับการเปิดกล้อง'
      );

    }


    scanner =
      new QrScanner(

        video,

        result => {

          const value =
            typeof result ===
            'string'

              ? result

              : result.data;


          if (
            value
          ) {

            processQr(
              value
            );

          }

        },

        {

          preferredCamera:
            'environment',

          maxScansPerSecond:
            10,

          highlightScanRegion:
            false,

          highlightCodeOutline:
            true,

          returnDetailedScanResult:
            true,

          onDecodeError:
            () => {

              /*
               * ไม่แสดง "No QR found"
               * ทุก frame
               */

            }

        }

      );


    scanner
      .setInversionMode(
        'both'
      );


    await scanner.start();


    statusBox.textContent =
      'พร้อมสแกน • นำ QR Code เข้ากรอบ';


  } catch (error) {

    console.error(
      error
    );


    showError(
      cameraErrorMessage(
        error
      )
    );


    retryButton.hidden =
      false;

  }

}


/***************************************************************
 * STOP
 ***************************************************************/

async function stopScanner() {

  if (
    !scanner
  ) {

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {}

}


/***************************************************************
 * FILE FALLBACK
 ***************************************************************/

qrFile.addEventListener(
  'change',
  async event => {

    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {

      return;

    }


    statusBox.className =
      'status';


    statusBox.textContent =
      'กำลังอ่าน QR Code จากรูปภาพ...';


    try {

      const result =
        await QrScanner.scanImage(

          file,

          {

            returnDetailedScanResult:
              true,

            alsoTryWithoutScanRegion:
              true

          }

        );


      const value =
        typeof result ===
        'string'

          ? result

          : result.data;


      if (!value) {

        throw new Error(
          'ไม่พบ QR Code'
        );

      }


      await processQr(
        value
      );


    } catch (error) {

      console.error(
        error
      );


      showError(
        'ไม่พบ QR Code ในภาพ กรุณาถ่าย QR ให้ชัดและเต็มภาพ'
      );

    }


    event.target.value =
      '';

  }
);


/***************************************************************
 * CAMERA ERROR
 ***************************************************************/

function cameraErrorMessage(
  error
) {

  const name =
    error &&
    error.name
      ? error.name
      : '';


  if (
    name ===
    'NotAllowedError'
  ) {

    return (
      'ไม่ได้รับอนุญาตใช้กล้อง กรุณาเปิดสิทธิ์ Camera ให้เว็บไซต์ แล้วกดลองใหม่'
    );

  }


  if (
    name ===
    'NotFoundError'
  ) {

    return (
      'ไม่พบกล้องในอุปกรณ์'
    );

  }


  if (
    name ===
    'NotReadableError'
  ) {

    return (
      'ไม่สามารถเปิดกล้องได้ อาจมีกล้องถูกใช้งานโดยแอปอื่น'
    );

  }


  if (
    name ===
    'OverconstrainedError'
  ) {

    return (
      'ไม่สามารถเลือกกล้องด้านหลังได้ กรุณาลองใหม่'
    );

  }


  return (
    error &&
    error.message
      ? error.message
      : String(
          error
        )
  );

}


/***************************************************************
 * UI
 ***************************************************************/

function showError(
  message
) {

  statusBox.className =
    'status error';


  statusBox.textContent =
    message;


  retryButton.hidden =
    false;

}


function showSuccess(
  message
) {

  statusBox.className =
    'status success';


  statusBox.textContent =
    message;

}


/***************************************************************
 * BUTTONS
 ***************************************************************/

startButton.addEventListener(
  'click',
  startScanner
);


retryButton.addEventListener(
  'click',
  startScanner
);


/***************************************************************
 * CLEANUP
 ***************************************************************/

window.addEventListener(
  'pagehide',
  () => {

    try {

      if (
        scanner
      ) {

        scanner.destroy();

      }

    } catch (error) {}

  }
);

</script>


</body>

</html>
