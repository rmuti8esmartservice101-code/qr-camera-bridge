<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1">

<title>
  QR Activity Camera
</title>


<style>

* {
  box-sizing:
    border-box;
}


body {

  margin:
    0;

  min-height:
    100vh;

  padding:
    15px;

  display:
    flex;

  flex-direction:
    column;

  justify-content:
    center;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:
    white;

  background:
    #10271A;
}


main {

  width:
    min(
      620px,
      100%
    );

  margin:
    auto;
}


h2 {

  text-align:
    center;
}


.camera {

  position:
    relative;

  overflow:
    hidden;

  min-height:
    480px;

  background:
    #06150B;

  border-radius:
    25px;
}


video {

  width:
    100%;

  height:
    480px;

  display:
    block;

  object-fit:
    cover;
}


#photoPreview {

  width:
    100%;

  height:
    480px;

  object-fit:
    cover;
}


.qrFrame {

  width:
    260px;

  height:
    260px;

  position:
    absolute;

  top:
    50%;

  left:
    50%;

  transform:
    translate(
      -50%,
      -50%
    );

  border:
    4px solid
    #9BE2AC;

  border-radius:
    25px;

  box-shadow:
    0 0 0 1000px
    rgba(
      0,
      0,
      0,
      .22
    );

  pointer-events:
    none;
}


#message {

  padding:
    14px;

  text-align:
    center;

  color:
    #D9EBDE;
}


#error {

  padding:
    8px;

  text-align:
    center;

  color:
    #FFBEBE;
}


button {

  width:
    100%;

  margin-top:
    10px;

  padding:
    15px;

  border:
    0;

  border-radius:
    15px;

  color:
    white;

  background:
    #73B984;

  font-size:
    16px;

  font-weight:
    600;

  cursor:
    pointer;
}


.secondary {

  color:
    #315D42;

  background:
    white;
}

</style>

</head>


<body>


<main>

<h2 id="title">
  กล้องกิจกรรม
</h2>


<div class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <div
    id="qrFrame"
    class="qrFrame">
  </div>


  <img
    id="photoPreview"
    hidden>

</div>


<div id="message">
  กำลังเปิดกล้อง...
</div>


<div id="error">
</div>


<button
  id="captureButton"
  hidden>

  📷 ถ่ายภาพ

</button>


<button
  class="secondary"
  onclick="window.close()">

  ปิด

</button>

</main>


<script type="module">

import QrScanner from
'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


const params =
  new URLSearchParams(
    location.search
  );


const MODE =
  params.get(
    'mode'
  ) ||
  'qr';


const NONCE =
  params.get(
    'nonce'
  ) ||
  '';


const TARGET_ORIGIN =
  params.get(
    'targetOrigin'
  ) ||
  '';


const video =
  document
    .getElementById(
      'video'
    );


const title =
  document
    .getElementById(
      'title'
    );


const message =
  document
    .getElementById(
      'message'
    );


const errorBox =
  document
    .getElementById(
      'error'
    );


const qrFrame =
  document
    .getElementById(
      'qrFrame'
    );


const captureButton =
  document
    .getElementById(
      'captureButton'
    );


const photoPreview =
  document
    .getElementById(
      'photoPreview'
    );


let scanner =
  null;


let stream =
  null;


/*************************************************
 SECURITY
*************************************************/

function targetOrigin() {

  try {

    const url =
      new URL(
        TARGET_ORIGIN
      );


    if (
      url.protocol !==
      'https:'
    ) {

      return '';
    }


    return url.origin;


  } catch (error) {

    return '';
  }
}


function send(
  type,
  data = {}
) {

  const origin =
    targetOrigin();


  if (
    !origin ||
    !window.opener
  ) {

    showError(
      'ไม่พบหน้าระบบต้นทาง'
    );

    return;
  }


  window.opener
    .postMessage(

      {

        app:
          'QR_ACTIVITY_CAMERA',

        type:
          type,

        nonce:
          NONCE,

        ...data
      },

      origin
    );
}


/*************************************************
 QR MODE
*************************************************/

async function startQrMode() {

  title.textContent =
    '🔳 สแกน QR Code';


  qrFrame.hidden =
    false;


  captureButton.hidden =
    true;


  try {

    const hasCamera =
      await QrScanner
        .hasCamera();


    if (!hasCamera) {

      throw new Error(
        'ไม่พบกล้องในอุปกรณ์'
      );
    }


    scanner =
      new QrScanner(

        video,

        result => {

          const value =

            typeof result ===
            'string'

              ? result

              : result.data;


          navigator
            .vibrate?.(
              100
            );


          scanner
            .stop();


          message.textContent =
            'อ่าน QR สำเร็จ';


          send(
            'QR_RESULT',
            {
              value:
                value
            }
          );


          setTimeout(
            () =>
              window.close(),
            350
          );
        },

        {

          preferredCamera:
            'environment',

          maxScansPerSecond:
            15,

          highlightScanRegion:
            true,

          highlightCodeOutline:
            true,

          returnDetailedScanResult:
            true
        }
      );


    await scanner
      .start();


    message.textContent =
      'นำ QR Code ให้อยู่ในกรอบ';


  } catch (error) {

    showError(
      cameraErrorText(
        error
      )
    );
  }
}


/*************************************************
 PHOTO MODE
*************************************************/

async function startPhotoMode() {

  title.textContent =
    '📷 ถ่ายภาพผู้เข้าร่วม';


  qrFrame.hidden =
    true;


  captureButton.hidden =
    false;


  try {

    try {

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: {

              facingMode: {
                ideal:
                  'user'
              },

              width: {
                ideal:
                  1280
              },

              height: {
                ideal:
                  720
              }
            },

            audio:
              false
          });

    } catch (error) {

      /*
       * fallback
       */

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:
              true,

            audio:
              false
          });
    }


    video.srcObject =
      stream;


    await video.play();


    message.textContent =
      'จัดใบหน้าให้อยู่กลางภาพแล้วกดถ่าย';


  } catch (error) {

    showError(
      cameraErrorText(
        error
      )
    );
  }
}


/*************************************************
 PHOTO CAPTURE
*************************************************/

captureButton
  .addEventListener(
    'click',
    () => {

      if (
        !video.videoWidth
      ) {

        showError(
          'กล้องยังไม่พร้อม'
        );

        return;
      }


      const photo =
        frameToDataUrl(

          video,

          800,

          .75,

          false
        );


      const thumb =
        frameToDataUrl(

          video,

          180,

          .70,

          true
        );


      photoPreview.src =
        photo;


      photoPreview.hidden =
        false;


      video.hidden =
        true;


      stopStream();


      message.textContent =
        'ถ่ายภาพเรียบร้อย';


      send(

        'PHOTO_RESULT',

        {

          photo:
            photo,

          thumb:
            thumb
        }
      );


      setTimeout(
        () =>
          window.close(),
        500
      );
    }
  );


function frameToDataUrl(
  video,
  size,
  quality,
  square
) {

  const canvas =
    document
      .createElement(
        'canvas'
      );


  const context =
    canvas
      .getContext(
        '2d'
      );


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (square) {

    const crop =
      Math.min(
        width,
        height
      );


    canvas.width =
      size;


    canvas.height =
      size;


    context.drawImage(

      video,

      (
        width -
        crop
      ) /
      2,

      (
        height -
        crop
      ) /
      2,

      crop,

      crop,

      0,

      0,

      size,

      size
    );

  } else {

    const scale =
      Math.min(
        1,
        size /
        width
      );


    canvas.width =
      Math.round(
        width *
        scale
      );


    canvas.height =
      Math.round(
        height *
        scale
      );


    context.drawImage(

      video,

      0,

      0,

      canvas.width,

      canvas.height
    );
  }


  return canvas
    .toDataURL(
      'image/jpeg',
      quality
    );
}


/*************************************************
 ERROR
*************************************************/

function cameraErrorText(
  error
) {

  console.error(
    error
  );


  if (
    error?.name ===
    'NotAllowedError'
  ) {

    return (
      'ไม่ได้รับอนุญาตใช้กล้อง กรุณาเปิด Camera Permission'
    );
  }


  if (
    error?.name ===
    'NotFoundError'
  ) {

    return (
      'ไม่พบกล้องในอุปกรณ์'
    );
  }


  if (
    error?.name ===
    'NotReadableError'
  ) {

    return (
      'กล้องกำลังถูกโปรแกรมอื่นใช้งาน'
    );
  }


  return (

    'เปิดกล้องไม่สำเร็จ: ' +

    (
      error?.message ||
      error
    )
  );
}


function showError(
  text
) {

  errorBox.textContent =
    text;


  message.textContent =
    'เกิดข้อผิดพลาด';


  send(

    'CAMERA_ERROR',

    {
      message:
        text
    }
  );
}


function stopStream() {

  if (!stream) {

    return;
  }


  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );


  stream =
    null;
}


/*************************************************
 CLEANUP
*************************************************/

window
  .addEventListener(
    'beforeunload',
    () => {

      try {

        scanner?.destroy();

      } catch (error) {}


      stopStream();
    }
  );


/*************************************************
 START
*************************************************/

if (
  MODE ===
  'photo'
) {

  startPhotoMode();

} else {

  startQrMode();
}

</script>

</body>
</html>
