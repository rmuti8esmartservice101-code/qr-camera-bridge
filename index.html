<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>ระบบพกสุข - เครื่องส่วนกลาง</title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    :root {
      --primary: #157c73;
      --primary-dark: #105f59;
      --primary-soft: #eaf7f5;

      --green: #168453;
      --red: #d64545;

      --bg: #f6f7f7;
      --white: #ffffff;

      --text: #182321;
      --muted: #788481;
      --border: #e2e7e6;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--bg);
    }


    button,
    input {
      font: inherit;
    }


    .hidden {
      display: none !important;
    }


    .app {
      width: min(100%, 680px);

      margin: 0 auto;

      padding-bottom:
        calc(
          30px +
          env(safe-area-inset-bottom)
        );
    }


    /* ======================================
       HEADER
       ====================================== */

    header {
      display: flex;

      align-items: center;

      gap: 10px;

      padding:
        calc(
          12px +
          env(safe-area-inset-top)
        )
        15px
        12px;

      background: white;

      border-bottom:
        1px solid var(--border);
    }


    .logo {
      width: 42px;
      height: 42px;

      display: grid;

      place-items: center;

      border-radius: 13px;

      color: white;

      background: var(--primary);

      font-size: 22px;
    }


    .brand {
      font-size: 16px;

      font-weight: 900;
    }


    .brand-sub {
      margin-top: 2px;

      color: var(--muted);

      font-size: 11px;
    }


    /* ======================================
       CONTENT
       ====================================== */

    main {
      padding: 12px;
    }


    .card {
      padding: 16px;

      margin-bottom: 11px;

      background: white;

      border:
        1px solid var(--border);

      border-radius: 19px;
    }


    h1,
    h2 {
      margin: 0;
    }


    .title {
      font-size: 19px;

      font-weight: 900;
    }


    .subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.5;
    }


    /* ======================================
       CAMERA
       ====================================== */

    #reader {
      width: 100%;

      margin-top: 13px;

      overflow: hidden;

      background: #111827;

      border-radius: 17px;
    }


    #reader video {
      width: 100% !important;

      border-radius: 17px;
    }


    .scanner-status {
      margin-top: 10px;

      color: var(--muted);

      font-size: 12px;

      text-align: center;
    }


    /* ======================================
       MEMBER
       ====================================== */

    .member-name {
      font-size: 24px;

      font-weight: 900;
    }


    .member-id {
      margin-top: 3px;

      color: var(--muted);

      font-size: 12px;
    }


    .stats {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 14px;
    }


    .stat {
      padding: 13px;

      background: #f8faf9;

      border:
        1px solid var(--border);

      border-radius: 14px;
    }


    .stat-label {
      color: var(--muted);

      font-size: 11px;
    }


    .stat-value {
      margin-top: 4px;

      font-size: 23px;

      font-weight: 900;
    }


    /* ======================================
       ACTIVITY
       ====================================== */

    .activity-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap: 9px;

      margin-top: 13px;
    }


    .activity {
      min-height: 78px;

      padding: 11px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background: white;

      color: var(--text);

      font-weight: 800;

      text-align: left;
    }


    .activity-icon {
      display: block;

      margin-bottom: 5px;

      font-size: 23px;
    }


    .activity-point {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;

      font-weight: 600;
    }


    .activity.selected {
      color: var(--primary-dark);

      border-color:
        var(--primary);

      background:
        var(--primary-soft);

      box-shadow:
        inset 0 0 0 1px
        var(--primary);
    }


    /* ======================================
       BUTTON
       ====================================== */

    .button {
      width: 100%;

      min-height: 52px;

      margin-top: 10px;

      padding:
        11px 15px;

      border: 0;

      border-radius: 14px;

      font-weight: 900;
    }


    .button.primary {
      color: white;

      background: var(--primary);
    }


    .button.soft {
      color: var(--primary-dark);

      background:
        var(--primary-soft);

      border:
        1px solid #cbe9e6;
    }


    .button:disabled {
      opacity: .5;
    }


    /* ======================================
       PHOTO
       ====================================== */

    #photoInput {
      display: none;
    }


    #photoPreview {
      width: 100%;

      max-height: 330px;

      margin-top: 11px;

      object-fit: cover;

      border-radius: 15px;
    }


    /* ======================================
       STATUS
       ====================================== */

    #status {
      margin-top: 10px;

      padding: 10px;

      border-radius: 12px;

      background: #f8faf9;

      color: var(--muted);

      font-size: 12px;

      text-align: center;
    }


    #status.error {
      color: var(--red);

      background: #fff0f0;
    }


    /* ======================================
       LOADING
       ====================================== */

    .loading {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(
          255,
          255,
          255,
          .88
        );
    }


    .loading-box {
      padding: 17px 22px;

      background: white;

      border-radius: 16px;

      font-weight: 900;

      box-shadow:
        0 10px 35px
        rgba(
          0,
          0,
          0,
          .12
        );
    }


    /* ======================================
       SUCCESS
       ====================================== */

    .success {
      position: fixed;

      inset: 0;

      z-index: 11000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(
          246,
          247,
          247,
          .97
        );
    }


    .success-card {
      width: min(100%,350px);

      padding: 28px 20px;

      background: white;

      border-radius: 22px;

      text-align: center;
    }


    .success-icon {
      color: var(--green);

      font-size: 58px;
    }


    .success-title {
      margin-top: 8px;

      color: var(--green);

      font-size: 23px;

      font-weight: 900;
    }


    .success-detail {
      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;
    }


    @media (
      max-width: 420px
    ) {

      main {
        padding: 9px;
      }


      .card {
        padding: 14px;
      }

    }

  </style>

</head>


<body>


<div
  id="loading"
  class="loading hidden">

  <div
    id="loadingText"
    class="loading-box">

    กำลังทำงาน...

  </div>

</div>


<div
  id="success"
  class="success hidden">

  <div class="success-card">

    <div class="success-icon">
      ✓
    </div>

    <div class="success-title">
      ลงทะเบียนสำเร็จ
    </div>

    <div
      id="successDetail"
      class="success-detail">
    </div>

  </div>

</div>


<div class="app">

  <header>

    <div class="logo">
      ♥
    </div>

    <div>

      <div class="brand">
        ระบบพกสุข
      </div>

      <div class="brand-sub">
        เครื่องสแกนส่วนกลาง
      </div>

    </div>

  </header>


  <main>


    <!-- CAMERA -->

    <section
      id="cameraSection"
      class="card">

      <h1 class="title">
        สแกนสมาชิก
      </h1>

      <div class="subtitle">
        นำ QR Code ของสมาชิกมาไว้ในกรอบ
      </div>

      <div id="reader"></div>

      <button
        id="openCameraButton"
        class="button primary hidden"
        type="button"
        onclick="startCamera()">

        📷 เปิดกล้อง

      </button>

      <div
        id="cameraStatus"
        class="scanner-status">

        กำลังเตรียมระบบ...

      </div>

    </section>


    <!-- MEMBER -->

    <section
      id="memberSection"
      class="hidden">


      <div class="card">

        <div
          id="memberName"
          class="member-name">
        </div>

        <div
          id="memberId"
          class="member-id">
        </div>


        <div class="stats">

          <div class="stat">

            <div class="stat-label">
              คะแนนสะสม
            </div>

            <div
              id="memberPoints"
              class="stat-value">
              0
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              ลำดับ
            </div>

            <div
              id="memberRank"
              class="stat-value">
              -
            </div>

          </div>

        </div>

      </div>


      <!-- ACTIVITIES -->

      <div class="card">

        <h2 class="title">
          เลือกกิจกรรม
        </h2>

        <div
          id="activityGrid"
          class="activity-grid">
        </div>

      </div>


      <!-- PHOTO -->

      <div class="card">

        <h2 class="title">
          ภาพกิจกรรม
        </h2>

        <div class="subtitle">
          ถ่ายภาพก่อนยืนยัน
        </div>


        <button
          type="button"
          class="button soft"
          onclick="takePhoto()">

          📷 ถ่ายภาพ

        </button>


        <input
          id="photoInput"
          type="file"
          accept="image/*"
          capture="environment"
          onchange="photoSelected(event)">


        <img
          id="photoPreview"
          class="hidden"
          alt="ภาพกิจกรรม">


        <button
          id="confirmButton"
          type="button"
          class="button primary"
          onclick="confirmCheckin()">

          ✓ ยืนยันการลงทะเบียน

        </button>

      </div>

    </section>


    <div id="status">
      กำลังเชื่อมต่อระบบ...
    </div>

  </main>

</div>


<script>

  /* =======================================================
     WORKER URL
     ======================================================= */

  const WORKER_URL =
    'https://poksuk-central-api.rmuti8-esmartservice1-01.workers.dev/';


  /* =======================================================
     STATE
     ======================================================= */

  const state = {

    scanner:
      null,

    cameraRunning:
      false,

    locked:
      false,

    scannedQr:
      '',

    member:
      null,

    activities:
      [],

    selectedActivity:
      '',

    photo:
      '',

    thumbnail:
      ''

  };


  /* =======================================================
     INIT
     ======================================================= */

  document.addEventListener(
    'DOMContentLoaded',
    init
  );


  async function init() {

    try {

      setStatus(
        'กำลังเชื่อมต่อระบบ...'
      );


      await callApi(
        'PING'
      );


      const activities =
        await callApi(
          'ACTIVITIES'
        );


      state.activities =
        Array.isArray(
          activities.activities
        )
          ? activities.activities
          : [];


      renderActivities();


      setStatus(
        'พร้อมสแกนสมาชิก'
      );


      await startCamera();


    } catch (error) {

      setStatus(
        error.message,
        true
      );


      document
        .getElementById(
          'openCameraButton'
        )
        .classList
        .remove(
          'hidden'
        );
    }
  }


  /* =======================================================
     API
     ======================================================= */

  async function callApi(
    action,
    payload = {}
  ) {

    const response =
      await fetch(
        WORKER_URL,
        {
          method:
            'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              action:
                action,

              payload:
                payload
            })
        }
      );


    let result;


    try {

      result =
        await response.json();

    } catch (error) {

      throw new Error(
        'ระบบตอบกลับผิดรูปแบบ'
      );
    }


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        'ระบบไม่สามารถดำเนินการได้'
      );
    }


    return result;
  }


  /* =======================================================
     CAMERA
     ======================================================= */

  async function startCamera() {

    if (
      state.cameraRunning
    ) {
      return;
    }


    state.locked =
      false;


    document
      .getElementById(
        'openCameraButton'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'cameraStatus'
      )
      .textContent =
        'กำลังเปิดกล้อง...';


    try {

      const cameras =
        await Html5Qrcode
          .getCameras();


      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          'ไม่พบกล้อง'
        );
      }


      let selected =
        cameras[
          cameras.length - 1
        ];


      const rear =
        cameras.find(
          function(camera) {

            const label =
              String(
                camera.label || ''
              )
                .toLowerCase();


            return (
              label.includes(
                'back'
              ) ||
              label.includes(
                'rear'
              ) ||
              label.includes(
                'environment'
              )
            );

          }
        );


      if (rear) {

        selected =
          rear;
      }


      state.scanner =
        new Html5Qrcode(
          'reader'
        );


      await state
        .scanner
        .start(

          selected.id,

          {
            fps:
              10,

            qrbox:
              function(
                width,
                height
              ) {

                const size =
                  Math.floor(
                    Math.min(
                      width,
                      height
                    ) *
                    0.70
                  );


                return {
                  width:
                    size,

                  height:
                    size
                };
              }
          },

          onQrSuccess,

          function() {}

        );


      state.cameraRunning =
        true;


      document
        .getElementById(
          'cameraStatus'
        )
        .textContent =
          'พร้อมสแกนสมาชิก';


    } catch (error) {

      state.cameraRunning =
        false;


      document
        .getElementById(
          'openCameraButton'
        )
        .classList
        .remove(
          'hidden'
        );


      setStatus(
        'เปิดกล้องไม่สำเร็จ: ' +
        (
          error.message ||
          error
        ),
        true
      );
    }
  }


  async function stopCamera() {

    if (!state.scanner) {

      state.cameraRunning =
        false;

      return;
    }


    try {

      if (
        state.cameraRunning
      ) {

        await state
          .scanner
          .stop();

      }

    } catch (error) {

      console.log(
        error
      );
    }


    try {

      state
        .scanner
        .clear();

    } catch (error) {

      console.log(
        error
      );
    }


    state.scanner =
      null;


    state.cameraRunning =
      false;
  }


  async function onQrSuccess(
    decodedText
  ) {

    if (
      state.locked ||
      !decodedText
    ) {
      return;
    }


    state.locked =
      true;


    state.scannedQr =
      String(
        decodedText
      ).trim();


    await stopCamera();


    await previewMember();
  }


  /* =======================================================
     MEMBER PREVIEW
     ======================================================= */

  async function previewMember() {

    showLoading(
      'กำลังตรวจสอบสมาชิก...'
    );


    try {

      const member =
        await callApi(
          'PREVIEW',
          {
            scannedQr:
              state.scannedQr
          }
        );


      state.member =
        member;


      document
        .getElementById(
          'memberName'
        )
        .textContent =
          member.fullName ||
          '-';


      document
        .getElementById(
          'memberId'
        )
        .textContent =
          member.memberId ||
          '';


      document
        .getElementById(
          'memberPoints'
        )
        .textContent =
          Number(
            member.totalPoints ||
            0
          );


      document
        .getElementById(
          'memberRank'
        )
        .textContent =
          member.currentRank
            ? (
                '#' +
                member.currentRank
              )
            : '-';


      hideLoading();


      document
        .getElementById(
          'cameraSection'
        )
        .classList
        .add(
          'hidden'
        );


      document
        .getElementById(
          'memberSection'
        )
        .classList
        .remove(
          'hidden'
        );


      setStatus(
        'เลือกกิจกรรมและถ่ายภาพ'
      );


    } catch (error) {

      hideLoading();


      setStatus(
        error.message,
        true
      );


      setTimeout(
        resetForNextMember,
        1400
      );
    }
  }


  /* =======================================================
     ACTIVITIES
     ======================================================= */

  function renderActivities() {

    const grid =
      document.getElementById(
        'activityGrid'
      );


    grid.innerHTML =
      '';


    state.activities.forEach(
      function(activity) {

        const button =
          document.createElement(
            'button'
          );


        button.type =
          'button';


        button.className =
          'activity';


        button.dataset.id =
          activity.activityId;


        button.innerHTML =

          '<span class="activity-icon">' +

          getActivityIcon(
            activity
          ) +

          '</span>' +

          escapeHtml(
            activity.activityName
          ) +

          '<span class="activity-point">' +

          (
            activity.activityType ===
            'HEALTH_CHECK'

              ? 'รออนุมัติ +' +
                activity.point +
                ' คะแนน'

              : '+' +
                activity.point +
                ' คะแนน'
          ) +

          '</span>';


        button.onclick =
          function() {

            chooseActivity(
              activity.activityId
            );

          };


        grid.appendChild(
          button
        );

      }
    );
  }


  function chooseActivity(
    id
  ) {

    state.selectedActivity =
      id;


    document
      .querySelectorAll(
        '.activity'
      )
      .forEach(
        function(button) {

          button
            .classList
            .toggle(

              'selected',

              button.dataset.id ===
              id

            );

        }
      );
  }


  function getActivityIcon(
    activity
  ) {

    if (
      activity.icon
    ) {

      return activity.icon;
    }


    const name =
      String(
        activity.activityName ||
        ''
      );


    if (
      name.includes(
        'เดิน'
      )
    ) {

      return '🚶';
    }


    if (
      name.includes(
        'วิ่ง'
      )
    ) {

      return '🏃';
    }


    if (
      name.includes(
        'ปั่น'
      )
    ) {

      return '🚲';
    }


    if (
      name.includes(
        'แอโรบิค'
      )
    ) {

      return '💃';
    }


    if (
      activity.activityType ===
      'HEALTH_CHECK'
    ) {

      return '🩺';
    }


    return '●';
  }


  /* =======================================================
     PHOTO
     ======================================================= */

  function takePhoto() {

    const input =
      document.getElementById(
        'photoInput'
      );


    input.value =
      '';


    input.click();
  }


  async function photoSelected(
    event
  ) {

    const file =
      event &&
      event.target &&
      event.target.files
        ? event.target.files[0]
        : null;


    if (!file) {
      return;
    }


    showLoading(
      'กำลังเตรียมภาพ...'
    );


    try {

      state.photo =
        await resizePhoto(
          file,
          600,
          600,
          0.65
        );


      state.thumbnail =
        await resizePhoto(
          file,
          180,
          180,
          0.70
        );


      const preview =
        document.getElementById(
          'photoPreview'
        );


      preview.src =
        state.photo;


      preview
        .classList
        .remove(
          'hidden'
        );


      hideLoading();


      setStatus(
        'พร้อมยืนยันการลงทะเบียน'
      );


    } catch (error) {

      hideLoading();


      setStatus(
        'ไม่สามารถเตรียมภาพได้',
        true
      );
    }
  }


  function resizePhoto(
    file,
    maxWidth,
    maxHeight,
    quality
  ) {

    return new Promise(
      function(
        resolve,
        reject
      ) {

        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            const image =
              new Image();


            image.onload =
              function() {

                const scale =
                  Math.min(

                    1,

                    maxWidth /
                      image.width,

                    maxHeight /
                      image.height
                  );


                const width =
                  Math.max(

                    1,

                    Math.round(
                      image.width *
                      scale
                    )
                  );


                const height =
                  Math.max(

                    1,

                    Math.round(
                      image.height *
                      scale
                    )
                  );


                const canvas =
                  document.createElement(
                    'canvas'
                  );


                canvas.width =
                  width;


                canvas.height =
                  height;


                canvas
                  .getContext(
                    '2d'
                  )
                  .drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                  );


                resolve(
                  canvas.toDataURL(
                    'image/jpeg',
                    quality
                  )
                );
              };


            image.onerror =
              reject;


            image.src =
              event.target.result;
          };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );
      }
    );
  }


  /* =======================================================
     CONFIRM
     ======================================================= */

  async function confirmCheckin() {

    if (
      !state.selectedActivity
    ) {

      setStatus(
        'กรุณาเลือกกิจกรรม',
        true
      );

      return;
    }


    if (
      !state.photo
    ) {

      setStatus(
        'กรุณาถ่ายภาพ',
        true
      );

      return;
    }


    const button =
      document.getElementById(
        'confirmButton'
      );


    button.disabled =
      true;


    showLoading(
      'กำลังลงทะเบียน...'
    );


    try {

      const result =
        await callApi(
          'CHECKIN',
          {

            scannedQr:
              state.scannedQr,

            activityId:
              state.selectedActivity,

            photoDataUrl:
              state.photo,

            thumbDataUrl:
              state.thumbnail

          }
        );


      hideLoading();


      document
        .getElementById(
          'successDetail'
        )
        .textContent =

          result.approvalStatus ===
          'PENDING'

            ? 'บันทึกกิจกรรมแล้ว • รออนุมัติคะแนน'

            : '+' +
              Number(
                result.pointAwarded ||
                0
              ) +
              ' คะแนน • คะแนนรวม ' +
              Number(
                result.totalPoints ||
                0
              );


      document
        .getElementById(
          'success'
        )
        .classList
        .remove(
          'hidden'
        );


      setTimeout(
        resetForNextMember,
        1200
      );


    } catch (error) {

      hideLoading();


      button.disabled =
        false;


      setStatus(
        error.message,
        true
      );
    }
  }


  /* =======================================================
     RESET
     ======================================================= */

  async function resetForNextMember() {

    document
      .getElementById(
        'success'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'memberSection'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'cameraSection'
      )
      .classList
      .remove(
        'hidden'
      );


    state.locked =
      false;


    state.scannedQr =
      '';


    state.member =
      null;


    state.selectedActivity =
      '';


    state.photo =
      '';


    state.thumbnail =
      '';


    document
      .querySelectorAll(
        '.activity'
      )
      .forEach(
        function(button) {

          button
            .classList
            .remove(
              'selected'
            );

        }
      );


    const preview =
      document.getElementById(
        'photoPreview'
      );


    preview.src =
      '';


    preview
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'photoInput'
      )
      .value =
        '';


    document
      .getElementById(
        'confirmButton'
      )
      .disabled =
        false;


    setStatus(
      'พร้อมสแกนสมาชิก'
    );


    await startCamera();
  }


  /* =======================================================
     UI
     ======================================================= */

  function setStatus(
    message,
    isError
  ) {

    const box =
      document.getElementById(
        'status'
      );


    box.textContent =
      message;


    box.className =
      isError
        ? 'error'
        : '';
  }


  function showLoading(
    message
  ) {

    document
      .getElementById(
        'loadingText'
      )
      .textContent =
        message;


    document
      .getElementById(
        'loading'
      )
      .classList
      .remove(
        'hidden'
      );
  }


  function hideLoading() {

    document
      .getElementById(
        'loading'
      )
      .classList
      .add(
        'hidden'
      );
  }


  function escapeHtml(
    value
  ) {

    return String(
      value || ''
    )

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#39;'
      );
  }

</script>
