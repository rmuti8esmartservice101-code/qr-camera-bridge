<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>กล้องสแกนสมาชิก - ระบบพกสุข</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f4f8f7;
      --card: #ffffff;
      --border: #dbe5e3;
      --text: #172123;
      --muted: #64748b;
      --red: #dc2626;
      --green: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);
      background: var(--bg);
    }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;

      padding:
        calc(14px + env(safe-area-inset-top))
        16px
        14px;

      background: white;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: var(--primary);
      color: white;

      font-size: 25px;
    }

    .title {
      font-size: 18px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 2px;

      color: var(--muted);
      font-size: 12px;
    }

    .container {
      padding: 14px;

      padding-bottom:
        calc(40px + env(safe-area-inset-bottom));
    }

    .card {
      padding: 16px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow:
        0 6px 24px
        rgba(15, 118, 110, 0.06);
    }

    h1 {
      margin: 0 0 5px;

      font-size: 22px;
    }

    .description {
      margin-bottom: 15px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.5;
    }

    #reader {
      width: 100%;

      overflow: hidden;

      background: #0f172a;

      border-radius: 18px;
    }

    #reader video {
      width: 100% !important;

      border-radius: 18px;
    }

    .button {
      width: 100%;
      min-height: 54px;

      margin-top: 14px;
      padding: 12px 16px;

      border: 0;
      border-radius: 14px;

      background: var(--primary);
      color: white;

      font: inherit;
      font-weight: 900;

      cursor: pointer;
    }

    .button.danger {
      color: var(--red);
      background: #fff1f2;

      border: 1px solid #fecdd3;
    }

    .button:disabled {
      opacity: 0.55;
    }

    .status {
      margin-top: 14px;
      padding: 12px;

      border-radius: 12px;

      background: #f8fafc;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.5;

      text-align: center;
    }

    .status.success {
      background: #dcfce7;
      color: var(--green);

      font-weight: 800;
    }

    .status.error {
      background: #fee2e2;
      color: var(--red);

      font-weight: 800;
    }

    .privacy {
      margin-top: 16px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.5;

      text-align: center;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      ♥
    </div>

    <div>
      <div class="title">
        ระบบพกสุข
      </div>

      <div class="subtitle">
        กล้องสแกน QR ส่วนกลาง
      </div>
    </div>

  </header>


  <main class="container">

    <section class="card">

      <h1>
        📷 สแกน QR สมาชิก
      </h1>

      <div class="description">
        นำ QR Code ของสมาชิกมาไว้ในกรอบ
        เมื่ออ่านสำเร็จระบบจะกลับไปยังเครื่องลงทะเบียนโดยอัตโนมัติ
      </div>


      <div id="reader"></div>


      <button
        id="startButton"
        class="button"
        type="button">

        📷 เปิดกล้องสแกน QR

      </button>


      <button
        id="stopButton"
        class="button danger hidden"
        type="button">

        ปิดกล้อง

      </button>


      <div
        id="status"
        class="status">

        พร้อมเปิดกล้อง

      </div>


      <div class="privacy">
        หน้านี้ใช้กล้องเพื่ออ่าน QR เท่านั้น
        ไม่บันทึกภาพ ไม่เก็บชื่อสมาชิก คะแนน PIN
        หรือฐานข้อมูลสมาชิกไว้บน GitHub
      </div>

    </section>

  </main>

</div>


<script>
  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    String(
      params.get('return') || ''
    ).trim();


  let scanner =
    null;


  let running =
    false;


  let completed =
    false;


  const startButton =
    document.getElementById(
      'startButton'
    );


  const stopButton =
    document.getElementById(
      'stopButton'
    );


  const statusBox =
    document.getElementById(
      'status'
    );


  startButton.addEventListener(
    'click',
    startScanner
  );


  stopButton.addEventListener(
    'click',
    stopScanner
  );


  if (!returnUrl) {

    setStatus(
      'ไม่พบปลายทางสำหรับส่ง QR กลับ กรุณาเปิดกล้องจากระบบพกสุข',
      'error'
    );


    startButton.disabled =
      true;
  }


  async function startScanner() {

    if (
      running ||
      completed
    ) {
      return;
    }


    if (
      typeof Html5Qrcode ===
      'undefined'
    ) {

      setStatus(
        'โหลดระบบสแกน QR ไม่สำเร็จ',
        'error'
      );


      return;
    }


    startButton.disabled =
      true;


    setStatus(
      'กำลังเปิดกล้อง...'
    );


    try {

      scanner =
        new Html5Qrcode(
          'reader'
        );


      await scanner.start(

        {
          facingMode: {
            ideal:
              'environment'
          }
        },

        {
          fps:
            12,

          qrbox:
            function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * 0.72
                );


              return {
                width:
                  size,

                height:
                  size
              };
            },

          aspectRatio:
            1
        },

        onQrSuccess,

        function() {
          // ไม่แจ้ง scan miss ทุก frame
        }
      );


      running =
        true;


      startButton.classList.add(
        'hidden'
      );


      stopButton.classList.remove(
        'hidden'
      );


      setStatus(
        'กำลังสแกน QR...'
      );


    } catch (error) {

      scanner =
        null;


      running =
        false;


      startButton.disabled =
        false;


      setStatus(
        error &&
        error.message
          ? error.message
          : 'ไม่สามารถเปิดกล้องได้',
        'error'
      );
    }
  }


  async function stopScanner() {

    if (scanner) {

      try {

        if (running) {

          await scanner.stop();

        }

      } catch (error) {

        console.log(
          error
        );

      }


      try {

        scanner.clear();

      } catch (error) {

        console.log(
          error
        );

      }
    }


    scanner =
      null;


    running =
      false;


    startButton.disabled =
      false;


    startButton.classList.remove(
      'hidden'
    );


    stopButton.classList.add(
      'hidden'
    );


    setStatus(
      'ปิดกล้องแล้ว'
    );
  }


  async function onQrSuccess(
    decodedText
  ) {

    if (
      completed ||
      !decodedText
    ) {
      return;
    }


    completed =
      true;


    const scannedValue =
      String(
        decodedText
      ).trim();


    if (!scannedValue) {

      completed =
        false;

      return;
    }


    setStatus(
      '✅ อ่าน QR สำเร็จ กำลังกลับระบบพกสุข...',
      'success'
    );


    try {

      if (
        scanner &&
        running
      ) {

        await scanner.stop();

      }

    } catch (error) {

      console.log(
        error
      );

    }


    running =
      false;


    /*
     * ส่ง QR กลับ Apps Script ด้วย query parameter
     *
     * returnUrl มี ?page=scanner อยู่แล้ว
     * จึงต่อด้วย &scan=
     */
    const separator =
      returnUrl.includes('?')
        ? '&'
        : '?';


    const target =
      returnUrl +
      separator +
      'scan=' +
      encodeURIComponent(
        scannedValue
      );


    window.location.replace(
      target
    );
  }


  function setStatus(
    message,
    type
  ) {

    statusBox.textContent =
      message;


    statusBox.className =
      'status';


    if (
      type ===
      'success'
    ) {

      statusBox.classList.add(
        'success'
      );

    } else if (
      type ===
      'error'
    ) {

      statusBox.classList.add(
        'error'
      );

    }
  }
</script>

</body>
</html>
