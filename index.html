<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>ระบบพกสุข</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

:root{
  --primary:#158077;
  --soft:#eaf7f5;
  --bg:#f6f8f7;
  --text:#182321;
  --muted:#7c8583;
  --border:#e0e6e4;
  --danger:#d74343;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
  font:inherit;
}

.hidden{
  display:none!important;
}

.app{
  max-width:680px;
  margin:auto;
  padding-bottom:30px;
}

header{
  background:#fff;
  padding:15px;
  font-size:20px;
  font-weight:900;
  border-bottom:1px solid var(--border);
}

main{
  padding:10px;
}

.card{
  background:white;
  padding:16px;
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:10px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.tab{
  min-height:46px;
  border:1px solid var(--border);
  border-radius:12px;
  background:white;
  font-weight:800;
}

.tab.active{
  background:var(--primary);
  color:white;
}

.title{
  font-size:20px;
  font-weight:900;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

#reader{
  margin-top:12px;
  border-radius:16px;
  overflow:hidden;
}

.search{
  width:100%;
  margin-top:12px;
  min-height:48px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 13px;
}

.result{
  margin-top:8px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:white;
}

.result-name{
  font-weight:900;
}

.result-id{
  color:var(--muted);
  font-size:11px;
}

.member-name{
  font-size:25px;
  font-weight:900;
}

.member-id{
  color:var(--muted);
  margin-top:3px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:13px;
}

.stat{
  padding:12px;
  background:#f8faf9;
  border:1px solid var(--border);
  border-radius:13px;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
}

.stat-value{
  margin-top:4px;
  font-weight:900;
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.activity,
.reward{
  padding:13px;
  min-height:82px;
  text-align:left;
  border:1px solid var(--border);
  border-radius:14px;
  background:white;
  font-weight:800;
}

.activity.selected{
  background:var(--soft);
  border-color:var(--primary);
}

.small{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.button{
  width:100%;
  min-height:50px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  background:var(--primary);
  color:white;
  font-weight:900;
}

.button.soft{
  color:var(--primary);
  background:var(--soft);
}

#photoInput{
  display:none;
}

#photoPreview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:14px;
  margin-top:10px;
}

#status{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:10px;
}

#status.error{
  color:var(--danger);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(255,255,255,.92);
  display:flex;
  align-items:center;
  justify-content:center;
}

.overlay-box{
  background:white;
  padding:18px 22px;
  border-radius:16px;
  font-weight:900;
}

</style>

</head>

<body>


<div
  id="loading"
  class="overlay hidden">

  <div
    id="loadingText"
    class="overlay-box">

    กำลังทำงาน...

  </div>

</div>


<div class="app">

<header>
  ♥ ระบบพกสุข
</header>

<main>


<div class="card tabs">

  <button
    class="tab active"
    id="tabQr"
    onclick="showQr()">

    📷 QR

  </button>

  <button
    class="tab"
    id="tabSearch"
    onclick="showSearch()">

    🔎 ค้นชื่อ

  </button>

  <button
    class="tab"
    id="tabReward"
    onclick="showRewards()">

    🎁 แลกแต้ม

  </button>

</div>


<!-- QR -->

<section
  id="qrSection"
  class="card">

  <div class="title">
    สแกนสมาชิก
  </div>

  <div id="reader"></div>

</section>


<!-- SEARCH -->

<section
  id="searchSection"
  class="card hidden">

  <div class="title">
    ค้นหาสมาชิก
  </div>

  <input
    id="searchInput"
    class="search"
    placeholder="พิมพ์ชื่อ หรือรหัสสมาชิก"
    oninput="searchChanged()">

  <div id="searchResults"></div>

</section>


<!-- MEMBER -->

<section
  id="memberSection"
  class="hidden">

  <div class="card">

    <div
      id="memberName"
      class="member-name">
    </div>

    <div
      id="memberId"
      class="member-id">
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          คะแนนสะสม
        </div>
        <div
          id="lifetimePoints"
          class="stat-value">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          แต้มคงเหลือ
        </div>
        <div
          id="availablePoints"
          class="stat-value">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          อันดับ
        </div>
        <div
          id="currentRank"
          class="stat-value">
          -
        </div>
      </div>

    </div>

  </div>


  <div
    id="activityCard"
    class="card">

    <div class="title">
      เลือกกิจกรรม
    </div>

    <div
      id="activityGrid"
      class="grid">
    </div>

  </div>


  <div
    id="photoCard"
    class="card">

    <button
      class="button soft"
      onclick="takePhoto()">

      📷 ถ่ายภาพ

    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="photoChanged(event)">

    <img
      id="photoPreview"
      class="hidden">

    <button
      class="button"
      onclick="confirmCheckin()">

      ✓ ยืนยันกิจกรรม

    </button>

  </div>


  <div
    id="rewardCard"
    class="card hidden">

    <div class="title">
      ของรางวัล
    </div>

    <div
      id="rewardGrid"
      class="grid">
    </div>

  </div>

</section>


<div id="status">
  กำลังเชื่อมต่อระบบ...
</div>


</main>
</div>


<script>

const WORKER_URL =
  'https://poksuk-central-api.rmuti8-esmartservice1-01.workers.dev/';


const state = {
  scanner:null,
  running:false,
  locked:false,
  member:null,
  scannedQr:'',
  selectedActivity:'',
  photo:'',
  activities:[],
  mode:'QR'
};


let searchTimer = null;


document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init(){

  try{

    const result =
      await Promise.all([
        api('PING'),
        api('ACTIVITIES')
      ]);

    state.activities =
      result[1].activities || [];

    renderActivities();

    setStatus('พร้อมใช้งาน');

    await startCamera();

  }catch(error){

    setStatus(
      error.message,
      true
    );
  }
}


async function api(
  action,
  payload={}
){

  const response =
    await fetch(
      WORKER_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:JSON.stringify({
          action:action,
          payload:payload
        })
      }
    );

  const data =
    await response.json();

  if(
    !response.ok ||
    !data.success
  ){
    throw new Error(
      data.message ||
      'เกิดข้อผิดพลาด'
    );
  }

  return data;
}


/* ==========================================================
   TABS
   ========================================================== */

async function showQr(){

  state.mode='QR';

  tab('tabQr');

  hide('searchSection');

  hide('memberSection');

  show('qrSection');

  resetMember();

  await startCamera();
}


async function showSearch(){

  state.mode='SEARCH';

  tab('tabSearch');

  await stopCamera();

  hide('qrSection');

  hide('memberSection');

  show('searchSection');

  resetMember();

  document
    .getElementById(
      'searchInput'
    )
    .focus();
}


async function showRewards(){

  state.mode='REWARD';

  tab('tabReward');

  await stopCamera();

  hide('qrSection');

  show('searchSection');

  hide('memberSection');

  resetMember();

  setStatus(
    'ค้นหาสมาชิกเพื่อแลกแต้ม'
  );
}


function tab(id){

  document
    .querySelectorAll('.tab')
    .forEach(function(el){
      el.classList.remove(
        'active'
      );
    });

  document
    .getElementById(id)
    .classList.add(
      'active'
    );
}


/* ==========================================================
   CAMERA
   ========================================================== */

async function startCamera(){

  if(state.running){
    return;
  }

  try{

    const cameras =
      await Html5Qrcode
        .getCameras();

    if(!cameras.length){
      throw new Error(
        'ไม่พบกล้อง'
      );
    }

    const camera =
      cameras[
        cameras.length-1
      ];

    state.scanner =
      new Html5Qrcode(
        'reader'
      );

    await state.scanner.start(
      camera.id,
      {
        fps:12,
        qrbox:{
          width:250,
          height:250
        }
      },
      qrSuccess,
      function(){}
    );

    state.running=true;

  }catch(error){

    setStatus(
      'เปิดกล้องไม่ได้: '+
      error.message,
      true
    );
  }
}


async function stopCamera(){

  if(
    !state.scanner
  ){
    state.running=false;
    return;
  }

  try{

    if(state.running){
      await state.scanner.stop();
    }

    state.scanner.clear();

  }catch(error){}

  state.scanner=null;
  state.running=false;
}


async function qrSuccess(text){

  if(state.locked){
    return;
  }

  state.locked=true;

  state.scannedQr=text;

  showLoading(
    'กำลังตรวจสมาชิก...'
  );

  try{

    const promise =
      api(
        'PREVIEW',
        {
          scannedQr:text
        }
      );

    await stopCamera();

    const member =
      await promise;

    openMember(member);

  }catch(error){

    setStatus(
      error.message,
      true
    );

    state.locked=false;

    await startCamera();

  }finally{

    hideLoading();
  }
}


/* ==========================================================
   SEARCH
   ========================================================== */

function searchChanged(){

  clearTimeout(
    searchTimer
  );

  searchTimer =
    setTimeout(
      searchMembers,
      350
    );
}


async function searchMembers(){

  const query =
    document
      .getElementById(
        'searchInput'
      )
      .value
      .trim();

  const box =
    document.getElementById(
      'searchResults'
    );

  if(query.length<2){

    box.innerHTML='';
    return;
  }

  try{

    const result =
      await api(
        'SEARCH_MEMBER',
        {query:query}
      );

    box.innerHTML='';

    (result.members||[])
      .forEach(
        function(member){

          const item =
            document
              .createElement(
                'button'
              );

          item.className =
            'result';

          item.style.width='100%';

          item.innerHTML =
            '<div class="result-name">'+
            escapeHtml(
              member.fullName
            )+
            '</div>'+
            '<div class="result-id">'+
            escapeHtml(
              member.memberId
            )+
            '</div>';

          item.onclick =
            function(){

              chooseMember(
                member.memberId
              );
            };

          box.appendChild(item);
        }
      );

  }catch(error){

    setStatus(
      error.message,
      true
    );
  }
}


async function chooseMember(
  memberId
){

  showLoading(
    'กำลังเปิดข้อมูลสมาชิก...'
  );

  try{

    const member =
      await api(
        'PREVIEW_MEMBER',
        {
          memberId:memberId
        }
      );

    openMember(member);

  }catch(error){

    setStatus(
      error.message,
      true
    );

  }finally{

    hideLoading();
  }
}


/* ==========================================================
   MEMBER
   ========================================================== */

async function openMember(
  member
){

  state.member=member;

  hide('qrSection');
  hide('searchSection');

  show('memberSection');

  document
    .getElementById(
      'memberName'
    )
    .textContent =
      member.fullName;

  document
    .getElementById(
      'memberId'
    )
    .textContent =
      member.memberId;

  document
    .getElementById(
      'lifetimePoints'
    )
    .textContent =
      Number(
        member.lifetimePoints||0
      );

  document
    .getElementById(
      'availablePoints'
    )
    .textContent =
      Number(
        member.availablePoints||0
      );

  document
    .getElementById(
      'currentRank'
    )
    .textContent =
      member.currentRank
        ? '#'+member.currentRank
        : '-';


  if(
    state.mode==='REWARD'
  ){

    hide('activityCard');
    hide('photoCard');
    show('rewardCard');

    await loadRewards();

  }else{

    show('activityCard');
    show('photoCard');
    hide('rewardCard');
  }
}


/* ==========================================================
   ACTIVITY
   ========================================================== */

function renderActivities(){

  const grid =
    document.getElementById(
      'activityGrid'
    );

  grid.innerHTML='';

  state.activities
    .forEach(function(activity){

      const button =
        document.createElement(
          'button'
        );

      button.className=
        'activity';

      button.innerHTML =
        escapeHtml(
          activity.activityName
        )+
        '<span class="small">'+
        (
          activity.activityType===
          'HEALTH_CHECK'
            ? 'รออนุมัติ +'+
              activity.point+
              ' คะแนน'
            : '+'+
              activity.point+
              ' คะแนน'
        )+
        '</span>';

      button.onclick =
        function(){

          state.selectedActivity =
            activity.activityId;

          document
            .querySelectorAll(
              '.activity'
            )
            .forEach(
              function(el){

                el.classList.remove(
                  'selected'
                );
              }
            );

          button
            .classList
            .add(
              'selected'
            );
        };

      grid.appendChild(
        button
      );
    });
}


/* ==========================================================
   PHOTO
   ========================================================== */

function takePhoto(){

  const input =
    document.getElementById(
      'photoInput'
    );

  input.value='';

  input.click();
}


async function photoChanged(e){

  const file =
    e.target.files[0];

  if(!file){
    return;
  }

  showLoading(
    'กำลังเตรียมรูป...'
  );

  try{

    state.photo =
      await resizeImage(
        file,
        500,
        .58
      );

    const image =
      document.getElementById(
        'photoPreview'
      );

    image.src=
      state.photo;

    show('photoPreview');

  }finally{

    hideLoading();
  }
}


function resizeImage(
  file,
  max,
  quality
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const reader =
        new FileReader();

      reader.onload =
        function(event){

          const image =
            new Image();

          image.onload =
            function(){

              const ratio =
                Math.min(
                  1,
                  max/image.width,
                  max/image.height
                );

              const canvas =
                document
                  .createElement(
                    'canvas'
                  );

              canvas.width =
                Math.round(
                  image.width*ratio
                );

              canvas.height =
                Math.round(
                  image.height*ratio
                );

              canvas
                .getContext('2d')
                .drawImage(
                  image,
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );

              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  quality
                )
              );
            };

          image.onerror=reject;

          image.src=
            event.target.result;
        };

      reader.onerror=reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}


/* ==========================================================
   CHECK-IN
   ========================================================== */

async function confirmCheckin(){

  if(
    !state.selectedActivity
  ){

    setStatus(
      'กรุณาเลือกกิจกรรม',
      true
    );

    return;
  }

  if(!state.photo){

    setStatus(
      'กรุณาถ่ายภาพ',
      true
    );

    return;
  }

  showLoading(
    'กำลังบันทึก...'
  );

  try{

    const payload = {
      activityId:
        state.selectedActivity,

      photoDataUrl:
        state.photo
    };


    if(
      state.scannedQr
    ){

      payload.scannedQr =
        state.scannedQr;

    }else{

      payload.memberId =
        state.member.memberId;
    }


    const result =
      await api(
        'CHECKIN',
        payload
      );


    alert(
      result.message
    );


    await resetHome();

  }catch(error){

    setStatus(
      error.message,
      true
    );

  }finally{

    hideLoading();
  }
}


/* ==========================================================
   REWARDS
   ========================================================== */

async function loadRewards(){

  showLoading(
    'กำลังโหลดของรางวัล...'
  );

  try{

    const result =
      await api(
        'REWARDS',
        {
          memberId:
            state.member.memberId
        }
      );

    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        result.availablePoints;

    const grid =
      document.getElementById(
        'rewardGrid'
      );

    grid.innerHTML='';


    (result.rewards||[])
      .forEach(
        function(reward){

          const button =
            document.createElement(
              'button'
            );

          button.className=
            'reward';

          button.innerHTML =
            escapeHtml(
              reward.rewardName
            )+
            '<span class="small">'+
            reward.pointsRequired+
            ' แต้ม • เหลือ '+
            reward.stock+
            '</span>';

          button.onclick =
            function(){

              redeemReward(
                reward
              );
            };

          grid.appendChild(
            button
          );
        }
      );

  }catch(error){

    setStatus(
      error.message,
      true
    );

  }finally{

    hideLoading();
  }
}


async function redeemReward(
  reward
){

  if(
    !confirm(
      'ยืนยันแลก '+
      reward.rewardName+
      ' จำนวน '+
      reward.pointsRequired+
      ' แต้ม?'
    )
  ){
    return;
  }

  showLoading(
    'กำลังแลกแต้ม...'
  );

  try{

    const result =
      await api(
        'REDEEM',
        {
          memberId:
            state.member.memberId,

          rewardId:
            reward.rewardId
        }
      );

    alert(
      'แลกสำเร็จ\nแต้มคงเหลือ '+
      result.availablePoints
    );

    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        result.availablePoints;

    await loadRewards();

  }catch(error){

    setStatus(
      error.message,
      true
    );

  }finally{

    hideLoading();
  }
}


/* ==========================================================
   RESET
   ========================================================== */

async function resetHome(){

  resetMember();

  state.mode='QR';

  tab('tabQr');

  hide('memberSection');
  hide('searchSection');

  show('qrSection');

  await startCamera();
}


function resetMember(){

  state.member=null;
  state.scannedQr='';
  state.selectedActivity='';
  state.photo='';
  state.locked=false;

  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(function(el){
      el.classList.remove(
        'selected'
      );
    });

  const image =
    document.getElementById(
      'photoPreview'
    );

  image.src='';

  hide('photoPreview');
}


/* ==========================================================
   UI
   ========================================================== */

function show(id){

  document
    .getElementById(id)
    .classList.remove(
      'hidden'
    );
}

function hide(id){

  document
    .getElementById(id)
    .classList.add(
      'hidden'
    );
}

function showLoading(text){

  document
    .getElementById(
      'loadingText'
    )
    .textContent=text;

  show('loading');
}

function hideLoading(){
  hide('loading');
}

function setStatus(
  text,
  error
){

  const el =
    document.getElementById(
      'status'
    );

  el.textContent=text;

  el.className=
    error
      ? 'error'
      : '';
}

function escapeHtml(value){

  return String(value||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

</script>

</body>
</html>
