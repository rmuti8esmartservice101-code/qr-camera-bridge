<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>พกสุข Central Station</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<style>

:root {
  --primary:#16877e;
  --soft:#e9f6f4;
  --border:#dfe6e4;
  --muted:#75817e;
  --danger:#d84545;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:#f5f8f7;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.hidden {
  display:none!important;
}

header {
  padding:16px;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.brand {
  font-size:23px;
  font-weight:900;
  color:var(--primary);
}

main {
  width:min(720px,100%);
  margin:auto;
  padding:12px;
}

.card {
  margin-bottom:12px;
  padding:17px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:19px;
}

.tabs {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.tab {
  min-height:52px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  font-weight:800;
}

.tab.active {
  color:#fff;
  background:var(--primary);
}

#reader {
  margin-top:12px;
  overflow:hidden;
  border-radius:16px;
}

.input {
  width:100%;
  min-height:50px;
  margin:6px 0;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:12px;
}

.btn {
  width:100%;
  min-height:49px;
  margin-top:8px;
  border:0;
  border-radius:13px;
  background:var(--primary);
  color:#fff;
  font-weight:900;
}

.btn.outline {
  color:var(--primary);
  border:1px solid var(--primary);
  background:#fff;
}

.member-name {
  font-size:27px;
  font-weight:900;
}

.muted {
  color:var(--muted);
}

.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:13px;
}

.stat {
  padding:11px;
  border:1px solid var(--border);
  border-radius:13px;
}

.stat b {
  display:block;
  font-size:21px;
  margin-top:4px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.activity,
.reward,
.search-result {
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fff;
  text-align:left;
}

.activity.selected {
  border:2px solid var(--primary);
  background:var(--soft);
}

.photo {
  width:100%;
  max-height:300px;
  margin-top:10px;
  border-radius:14px;
  object-fit:cover;
}

.overlay {
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.9);
}

.loading-box {
  padding:18px;
  border-radius:14px;
  background:#fff;
  font-weight:800;
}

#status {
  padding:12px;
  text-align:center;
  color:var(--muted);
}

#status.error {
  color:var(--danger);
}

</style>

</head>


<body>


<div
  id="loading"
  class="overlay hidden">

  <div
    id="loadingText"
    class="loading-box">

    กำลังทำงาน...

  </div>

</div>


<header>

  <div class="brand">
    ♥ ระบบพกสุข
  </div>

  <div class="muted">
    Central Station
  </div>

</header>


<main>


<div class="card tabs">

  <button
    id="tabQr"
    class="tab active"
    onclick="showQr()">
    📷 QR
  </button>

  <button
    id="tabSearch"
    class="tab"
    onclick="showSearch()">
    🔎 ค้นชื่อ
  </button>

  <button
    id="tabReward"
    class="tab"
    onclick="showRewardSearch()">
    🎁 แลกแต้ม
  </button>

</div>


<section
  id="qrSection"
  class="card">

  <h2>สแกน QR</h2>

  <div id="reader"></div>

</section>


<section
  id="searchSection"
  class="card hidden">

  <h2>ค้นหาสมาชิก</h2>

  <input
    id="searchInput"
    class="input"
    placeholder="ชื่อ หรือ Member ID"
    oninput="searchChanged()">

  <div id="searchResults"></div>

</section>


<section
  id="registerSection"
  class="card hidden">

  <h2>ลงทะเบียนสมาชิกใหม่</h2>

  <p>
    QR:
    <b id="registerQrCode"></b>
  </p>

  <input
    id="regName"
    class="input"
    placeholder="ชื่อ-นามสกุล *">

  <input
    id="regBirthYear"
    class="input"
    inputmode="numeric"
    placeholder="ปีเกิด พ.ศ. *">

  <input
    id="regHouseNo"
    class="input"
    placeholder="บ้านเลขที่">

  <input
    id="regSubdistrict"
    class="input"
    placeholder="ตำบล">

  <input
    id="regVillageNo"
    class="input"
    placeholder="หมู่">

  <input
    id="regPhone"
    class="input"
    placeholder="เบอร์โทร">

  <label>

    <input
      id="regConsent"
      type="checkbox">

    ยินยอมให้ใช้ข้อมูลเพื่อการลงทะเบียนและกิจกรรม

  </label>

  <button
    class="btn"
    onclick="registerMember()">

    ลงทะเบียน

  </button>

</section>


<section
  id="memberSection"
  class="hidden">


  <div class="card">

    <div
      id="memberName"
      class="member-name">
    </div>

    <div
      id="memberId"
      class="muted">
    </div>


    <div class="stats">

      <div class="stat">
        <small>คะแนนสะสม</small>
        <b id="lifetimePoints">0</b>
      </div>

      <div class="stat">
        <small>แต้มคงเหลือ</small>
        <b id="availablePoints">0</b>
      </div>

      <div class="stat">
        <small>อันดับ</small>
        <b id="rank">-</b>
      </div>

    </div>

  </div>


  <div
    id="activityCard"
    class="card">

    <h3>เลือกกิจกรรม</h3>

    <div
      id="activities"
      class="grid">
    </div>

  </div>


  <div
    id="photoCard"
    class="card">

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
      class="input"
      onchange="photoChanged(event)">

    <img
      id="photoPreview"
      class="photo hidden">

    <button
      class="btn"
      onclick="submitCheckin()">

      ยืนยันกิจกรรม

    </button>

  </div>


  <div
    id="rewardCard"
    class="card hidden">

    <h3>ของรางวัล</h3>

    <div
      id="rewards"
      class="grid">
    </div>

  </div>


</section>


<div id="status">
  กำลังเชื่อมต่อ...
</div>


</main>


<script>

const API =
  'https://poksuk-central-api.rmuti8-esmartservice1-01.workers.dev/';


const state = {

  scanner:null,

  running:false,

  locked:false,

  mode:'QR',

  scannedQr:'',

  registerQrToken:'',

  member:null,

  activityId:'',

  photo:'',

  activities:[]

};


let searchTimer = null;


/* =========================================================
   INIT
   ========================================================= */

window.addEventListener(
  'load',
  init
);


async function init() {

  loading(
    true,
    'กำลังเชื่อมต่อระบบ...'
  );


  try {

    await api(
      'PING'
    );


    const result =
      await api(
        'ACTIVITIES'
      );


    state.activities =
      result.activities || [];


    renderActivities();


    setStatus(
      'พร้อมใช้งาน'
    );


    await startCamera();


  } catch (error) {

    setStatus(
      message(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* =========================================================
   API
   ========================================================= */

async function api(
  action,
  payload={}
) {

  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function() {

        controller.abort();

      },
      20000
    );


  try {

    const response =
      await fetch(
        API,
        {

          method:'POST',

          mode:'cors',

          cache:'no-store',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              action,
              payload
            }),

          signal:
            controller.signal

        }
      );


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          text
        );

    } catch {

      throw new Error(
        'API ตอบกลับไม่ถูกต้อง'
      );
    }


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status +
        ': ' +
        (
          data.message ||
          'API Error'
        )
      );
    }


    if (!data.success) {

      throw new Error(
        data.message ||
        'เกิดข้อผิดพลาด'
      );
    }


    return data;


  } catch (error) {

    if (
      error.name ===
      'AbortError'
    ) {

      throw new Error(
        'เชื่อมต่อระบบนานเกินไป'
      );
    }


    if (
      String(
        error.message || error
      )
        .toLowerCase()
        .includes(
          'load failed'
        )
    ) {

      throw new Error(
        'เชื่อมต่อ Central API ไม่สำเร็จ'
      );
    }


    throw error;


  } finally {

    clearTimeout(
      timeout
    );
  }
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

  if (
    state.running
  ) {

    return;
  }


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras.length
    ) {

      throw new Error(
        'ไม่พบกล้อง'
      );
    }


    state.scanner =
      new Html5Qrcode(
        'reader'
      );


    const camera =
      cameras[
        cameras.length - 1
      ];


    await state.scanner.start(

      camera.id,

      {

        fps:10,

        qrbox:{
          width:260,
          height:260
        }

      },

      qrSuccess,

      function(){}

    );


    state.running =
      true;


  } catch (error) {

    setStatus(
      'เปิดกล้องไม่ได้: ' +
      message(error),
      true
    );
  }
}


async function stopCamera() {

  if (
    !state.scanner
  ) {

    state.running =
      false;

    return;
  }


  try {

    if (
      state.running
    ) {

      await state.scanner.stop();
    }


    state.scanner.clear();


  } catch (e) {}


  state.scanner =
    null;


  state.running =
    false;
}


/* =========================================================
   QR
   ========================================================= */

async function qrSuccess(
  value
) {

  if (
    state.locked ||
    !value
  ) {

    return;
  }


  state.locked =
    true;


  state.scannedQr =
    String(value);


  loading(
    true,
    'กำลังตรวจสอบ QR...'
  );


  try {

    const result =
      await api(
        'PREVIEW',
        {
          scannedQr:
            state.scannedQr
        }
      );


    await stopCamera();


    if (
      result.needsRegistration
    ) {

      state.registerQrToken =
        result.qrToken;


      document
        .getElementById(
          'registerQrCode'
        )
        .textContent =
          result.displayCode;


      hideAll();


      show(
        'registerSection'
      );


      setStatus(
        'กรอกข้อมูลเพื่อลงทะเบียนสมาชิกใหม่'
      );


      return;
    }


    openMember(
      result
    );


  } catch (error) {

    state.locked =
      false;


    state.scannedQr =
      '';


    setStatus(
      message(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* =========================================================
   REGISTER
   ========================================================= */

async function registerMember() {

  const payload = {

    qrToken:
      state.registerQrToken,

    fullName:
      val(
        'regName'
      ),

    birthYearBE:
      val(
        'regBirthYear'
      ),

    houseNo:
      val(
        'regHouseNo'
      ),

    subdistrict:
      val(
        'regSubdistrict'
      ),

    villageNo:
      val(
        'regVillageNo'
      ),

    phone:
      val(
        'regPhone'
      ),

    consentAccepted:
      document
        .getElementById(
          'regConsent'
        )
        .checked

  };


  loading(
    true,
    'กำลังลงทะเบียน...'
  );


  try {

    const result =
      await api(
        'REGISTER_MEMBER',
        payload
      );


    const member =
      await api(
        'PREVIEW_MEMBER',
        {
          memberId:
            result.memberId
        }
      );


    state.scannedQr = '';


    openMember(
      member
    );


    setStatus(
      'ลงทะเบียนเรียบร้อย'
    );


  } catch (error) {

    setStatus(
      message(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* =========================================================
   TABS
   ========================================================= */

async function showQr() {

  state.mode =
    'QR';


  activate(
    'tabQr'
  );


  reset();


  hideAll();


  show(
    'qrSection'
  );


  await startCamera();
}


async function showSearch() {

  state.mode =
    'SEARCH';


  activate(
    'tabSearch'
  );


  await stopCamera();


  reset();


  hideAll();


  show(
    'searchSection'
  );
}


async function showRewardSearch() {

  state.mode =
    'REWARD';


  activate(
    'tabReward'
  );


  await stopCamera();


  reset();


  hideAll();


  show(
    'searchSection'
  );


  setStatus(
    'ค้นหาสมาชิกเพื่อแลกแต้ม'
  );
}


function activate(
  id
) {

  document
    .querySelectorAll(
      '.tab'
    )
    .forEach(
      function(tab) {

        tab.classList.remove(
          'active'
        );

      }
    );


  document
    .getElementById(
      id
    )
    .classList.add(
      'active'
    );
}


/* =========================================================
   SEARCH
   ========================================================= */

function searchChanged() {

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      searchMembers,
      350
    );
}


async function searchMembers() {

  const query =
    val(
      'searchInput'
    );


  const root =
    document.getElementById(
      'searchResults'
    );


  if (
    query.length < 2
  ) {

    root.innerHTML =
      '';

    return;
  }


  try {

    const result =
      await api(
        'SEARCH_MEMBER',
        {
          query
        }
      );


    root.innerHTML =
      result.members
        .map(
          function(row) {

            return `

              <button
                class="search-result"
                onclick="selectMember('${escapeJs(row.memberId)}')">

                <b>
                  ${escapeHtml(
                    row.fullName
                  )}
                </b>

                <br>

                <small>
                  ${escapeHtml(
                    row.memberId
                  )}
                </small>

              </button>

            `;

          }
        )
        .join('');


  } catch (error) {

    setStatus(
      message(error),
      true
    );
  }
}


async function selectMember(
  memberId
) {

  loading(
    true,
    'กำลังเปิดสมาชิก...'
  );


  try {

    const result =
      await api(
        'PREVIEW_MEMBER',
        {
          memberId
        }
      );


    openMember(
      result
    );


  } catch (error) {

    setStatus(
      message(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* =========================================================
   MEMBER
   ========================================================= */

async function openMember(
  member
) {

  state.member =
    member;


  hideAll();


  show(
    'memberSection'
  );


  document
    .getElementById(
      'memberName'
    )
    .textContent =
      member.fullName;


  document
    .getElementById(
      'memberId'
    )
    .textContent =
      member.memberId;


  document
    .getElementById(
      'lifetimePoints'
    )
    .textContent =
      member.lifetimePoints;


  document
    .getElementById(
      'availablePoints'
    )
    .textContent =
      member.availablePoints;


  document
    .getElementById(
      'rank'
    )
    .textContent =
      member.currentRank
        ? '#' +
          member.currentRank
        : '-';


  if (
    state.mode ===
    'REWARD'
  ) {

    hide(
      'activityCard'
    );


    hide(
      'photoCard'
    );


    show(
      'rewardCard'
    );


    await loadRewards();


  } else {

    show(
      'activityCard'
    );


    show(
      'photoCard'
    );


    hide(
      'rewardCard'
    );
  }
}


/* =========================================================
   ACTIVITIES
   ========================================================= */

function renderActivities() {

  const root =
    document.getElementById(
      'activities'
    );


  root.innerHTML =
    state.activities
      .map(
        function(activity) {

          return `

            <button
              id="activity-${escapeHtml(activity.activityId)}"
              class="activity"
              onclick="selectActivity('${escapeJs(activity.activityId)}')">

              <b>
                ${escapeHtml(
                  activity.icon
                )}
                ${escapeHtml(
                  activity.activityName
                )}
              </b>

              <br>

              <small class="muted">

                ${
                  activity.activityType ===
                  'HEALTH_CHECK'
                    ? 'รออนุมัติ +' +
                      activity.point
                    : '+' +
                      activity.point +
                      ' คะแนน'
                }

              </small>

            </button>

          `;

        }
      )
      .join('');
}


function selectActivity(
  id
) {

  state.activityId =
    id;


  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(
      function(button) {

        button.classList.remove(
          'selected'
        );

      }
    );


  const button =
    document.getElementById(
      'activity-' +
      id
    );


  if (button) {

    button.classList.add(
      'selected'
    );
  }
}


/* =========================================================
   PHOTO
   ========================================================= */

async function photoChanged(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {

    return;
  }


  loading(
    true,
    'กำลังเตรียมภาพ...'
  );


  try {

    state.photo =
      await resize(
        file
      );


    const image =
      document.getElementById(
        'photoPreview'
      );


    image.src =
      state.photo;


    image.classList.remove(
      'hidden'
    );


  } finally {

    loading(false);
  }
}


function resize(
  file
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const image =
            new Image();


          image.onload =
            function() {

              const ratio =
                Math.min(
                  1,
                  600 /
                  image.width,
                  600 /
                  image.height
                );


              const canvas =
                document.createElement(
                  'canvas'
                );


              canvas.width =
                Math.round(
                  image.width *
                  ratio
                );


              canvas.height =
                Math.round(
                  image.height *
                  ratio
                );


              canvas
                .getContext(
                  '2d'
                )
                .drawImage(
                  image,
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  .62
                )
              );
            };


          image.onerror =
            reject;


          image.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );
}


/* =========================================================
   CHECKIN
   ========================================================= */

async function submitCheckin() {

  if (
    !state.member
  ) {

    setStatus(
      'ไม่พบสมาชิก',
      true
    );

    return;
  }


  if (
    !state.activityId
  ) {

    setStatus(
      'กรุณาเลือกกิจกรรม',
      true
    );

    return;
  }


  if (
    !state.photo
  ) {

    setStatus(
      'กรุณาถ่ายภาพ',
      true
    );

    return;
  }


  loading(
    true,
    'กำลังบันทึก...'
  );


  try {

    const payload = {

      memberId:
        state.member.memberId,

      activityId:
        state.activityId,

      photoDataUrl:
        state.photo

    };


    if (
      state.scannedQr
    ) {

      payload.scannedQr =
        state.scannedQr;
    }


    const result =
      await api(
        'CHECKIN',
        payload
      );


    alert(
      result.message
    );


    await showQr();


  } catch (error) {

    setStatus(
      message(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* =========================================================
   REWARDS
   ========================================================= */

async function loadRewards() {

  try {

    const result =
      await api(
        'REWARDS',
        {
          memberId:
            state.member.memberId
        }
      );


    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        result.availablePoints;


    document
      .getElementById(
        'rewards'
      )
      .innerHTML =
        result.rewards
          .map(
            function(reward) {

              return `

                <button
                  class="reward"
                  onclick="redeem('${escapeJs(reward.rewardId)}','${escapeJs(reward.rewardName)}',${Number(reward.pointsRequired)})">

                  <b>
                    ${escapeHtml(
                      reward.rewardName
                    )}
                  </b>

                  <br>

                  <small>
                    ${reward.pointsRequired}
                    แต้ม • เหลือ
                    ${reward.stock}
                  </small>

                </button>

              `;

            }
          )
          .join('');


  } catch (error) {

    setStatus(
      message(error),
      true
    );
  }
}


async function redeem(
  rewardId,
  rewardName,
  points
) {

  if (
    !confirm(
      'ยืนยันแลก ' +
      rewardName +
      ' ใช้ ' +
      points +
      ' แต้ม?'
    )
  ) {

    return;
  }


  loading(
    true,
    'กำลังแลกแต้ม...'
  );


  try {

    const result =
      await api(
        'REDEEM',
        {

          memberId:
            state.member.memberId,

          rewardId

        }
      );


    alert(
      result.message +
      '\nแต้มคงเหลือ ' +
      result.availablePoints
    );


    await loadRewards();


  } catch (error) {

    setStatus(
      message(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* =========================================================
   UI
   ========================================================= */

function hideAll() {

  [
    'qrSection',
    'searchSection',
    'registerSection',
    'memberSection'
  ].forEach(
    hide
  );
}


function reset() {

  state.member =
    null;

  state.scannedQr =
    '';

  state.registerQrToken =
    '';

  state.activityId =
    '';

  state.photo =
    '';

  state.locked =
    false;


  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(
      function(button) {

        button.classList.remove(
          'selected'
        );

      }
    );


  const image =
    document.getElementById(
      'photoPreview'
    );


  image.src = '';

  image.classList.add(
    'hidden'
  );
}


function show(
  id
) {

  const element =
    document.getElementById(
      id
    );


  if (element) {

    element.classList.remove(
      'hidden'
    );
  }
}


function hide(
  id
) {

  const element =
    document.getElementById(
      id
    );


  if (element) {

    element.classList.add(
      'hidden'
    );
  }
}


function loading(
  enabled,
  text
) {

  if (enabled) {

    document
      .getElementById(
        'loadingText'
      )
      .textContent =
        text ||
        'กำลังทำงาน...';


    show(
      'loading'
    );

  } else {

    hide(
      'loading'
    );
  }
}


function setStatus(
  text,
  error
) {

  const element =
    document.getElementById(
      'status'
    );


  element.textContent =
    text || '';


  element.className =
    error
      ? 'error'
      : '';
}


function val(
  id
) {

  return String(
    document
      .getElementById(
        id
      )
      .value || ''
  ).trim();
}


function message(
  error
) {

  return error &&
    error.message
      ? error.message
      : String(error);
}


function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}


function escapeJs(
  value
) {

  return String(
    value || ''
  )
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}

</script>
