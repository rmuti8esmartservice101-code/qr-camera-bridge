<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#ffffff">

<title>ระบบพกสุข</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>


<style>

:root {
  --primary:#16877e;
  --dark:#116d66;
  --soft:#e9f6f4;
  --bg:#f6f8f7;
  --white:#ffffff;
  --text:#17211f;
  --muted:#7b8582;
  --border:#dfe5e3;
  --danger:#d64747;
}

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input {
  font:inherit;
}

button {
  cursor:pointer;
}

.hidden {
  display:none!important;
}

.app {
  max-width:720px;
  margin:auto;
  min-height:100vh;
}

header {
  padding:16px 18px;
  background:white;
  border-bottom:1px solid var(--border);
}

.brand {
  display:flex;
  gap:12px;
  align-items:center;
}

.logo {
  width:47px;
  height:47px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  background:var(--primary);
  color:white;
  font-size:26px;
}

.brand-name {
  font-size:23px;
  font-weight:900;
}

.brand-sub {
  margin-top:2px;
  font-size:12px;
  color:var(--muted);
}

main {
  padding:12px;
}

.card {
  margin-bottom:12px;
  padding:17px;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
}

.tabs {
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:8px;
}

.tab {
  min-height:55px;
  border:1px solid var(--border);
  border-radius:15px;
  background:white;
  font-weight:800;
}

.tab.active {
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}

.title {
  font-size:22px;
  font-weight:900;
}

.subtitle {
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
}

#reader {
  width:100%;
  margin-top:15px;
  overflow:hidden;
  border-radius:18px;
}

.search {
  width:100%;
  height:52px;
  margin-top:14px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
}

.search:focus {
  border-color:var(--primary);
}

.result {
  display:block;
  width:100%;
  margin-top:8px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:white;
  text-align:left;
}

.result-name {
  font-weight:900;
}

.result-id {
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.member-name {
  font-size:28px;
  font-weight:900;
}

.member-id {
  margin-top:4px;
  color:var(--muted);
}

.stats {
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:8px;
  margin-top:15px;
}

.stat {
  padding:12px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#fafcfb;
}

.stat-label {
  color:var(--muted);
  font-size:10px;
}

.stat-value {
  margin-top:5px;
  font-size:23px;
  font-weight:900;
}

.grid {
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:9px;
  margin-top:13px;
}

.activity,
.reward {
  min-height:95px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:17px;
  background:white;
  text-align:left;
}

.activity.selected {
  border:2px solid var(--primary);
  background:var(--soft);
}

.item-title {
  font-size:17px;
  font-weight:900;
}

.item-sub {
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.button {
  width:100%;
  min-height:52px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:var(--primary);
  color:white;
  font-weight:900;
}

.button.secondary {
  background:white;
  color:var(--primary);
  border:1px solid var(--primary);
}

#photoInput {
  display:none;
}

#photoPreview {
  width:100%;
  max-height:300px;
  margin-top:12px;
  border-radius:15px;
  object-fit:cover;
}

#status {
  padding:10px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

#status.error {
  color:var(--danger);
}

.overlay {
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.9);
}

.loading {
  min-width:210px;
  padding:19px;
  border:1px solid var(--border);
  border-radius:17px;
  background:white;
  text-align:center;
  font-weight:900;
}

</style>

</head>


<body>


<div
  id="loading"
  class="overlay hidden">

  <div
    id="loadingText"
    class="loading">

    กำลังทำงาน...

  </div>

</div>


<div class="app">


<header>

  <div class="brand">

    <div class="logo">
      ♥
    </div>

    <div>

      <div class="brand-name">
        ระบบพกสุข
      </div>

      <div class="brand-sub">
        เครื่องส่วนกลาง
      </div>

    </div>

  </div>

</header>


<main>


<div class="card">

  <div class="tabs">

    <button
      id="tabQr"
      class="tab active"
      onclick="showQr()">

      📷 QR

    </button>

    <button
      id="tabSearch"
      class="tab"
      onclick="showSearch()">

      🔎 ค้นชื่อ

    </button>

    <button
      id="tabReward"
      class="tab"
      onclick="showRewardSearch()">

      🎁 แลกแต้ม

    </button>

  </div>

</div>


<section
  id="qrSection"
  class="card">

  <div class="title">
    สแกนสมาชิก
  </div>

  <div class="subtitle">
    นำ QR Code มาไว้ในกรอบ
  </div>

  <div id="reader"></div>

</section>


<section
  id="searchSection"
  class="card hidden">

  <div class="title">
    ค้นหาสมาชิก
  </div>

  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="พิมพ์ชื่อหรือรหัสสมาชิก"
    oninput="searchChanged()">

  <div id="searchResults"></div>

</section>


<section
  id="memberSection"
  class="hidden">


  <div class="card">

    <div
      id="memberName"
      class="member-name">
    </div>

    <div
      id="memberId"
      class="member-id">
    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          คะแนนสะสม
        </div>

        <div
          id="lifetimePoints"
          class="stat-value">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          แต้มคงเหลือ
        </div>

        <div
          id="availablePoints"
          class="stat-value">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          อันดับ
        </div>

        <div
          id="rank"
          class="stat-value">
          -
        </div>

      </div>

    </div>

  </div>


  <div
    id="activityCard"
    class="card">

    <div class="title">
      เลือกกิจกรรม
    </div>

    <div
      id="activityGrid"
      class="grid">
    </div>

  </div>


  <div
    id="photoCard"
    class="card">

    <button
      class="button secondary"
      onclick="takePhoto()">

      📷 ถ่ายภาพ

    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="photoChanged(event)">

    <img
      id="photoPreview"
      class="hidden">

    <button
      class="button"
      onclick="submitCheckin()">

      ✓ ยืนยันกิจกรรม

    </button>

  </div>


  <div
    id="rewardCard"
    class="card hidden">

    <div class="title">
      เลือกของรางวัล
    </div>

    <div
      id="rewardGrid"
      class="grid">
    </div>

  </div>


</section>


<div id="status">
  กำลังเชื่อมต่อระบบ...
</div>


</main>

</div>


<script>

const API_URL =
  'https://poksuk-central-api.rmuti8-esmartservice1-01.workers.dev/';


const state = {

  scanner:null,

  running:false,

  lock:false,

  member:null,

  qr:'',

  activityId:'',

  photo:'',

  activities:[],

  mode:'QR'
};


let searchTimer = null;


document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init() {

  loading(
    true,
    'กำลังเชื่อมต่อระบบ...'
  );

  try {

    const responses =
      await Promise.all([
        api('PING'),
        api('ACTIVITIES')
      ]);

    state.activities =
      responses[1].activities || [];

    renderActivities();

    setStatus(
      'พร้อมใช้งาน'
    );

    await startCamera();

  } catch (error) {

    setStatus(
      getError(error),
      true
    );

  } finally {

    loading(false);
  }
}


/* ==========================================================
   API
   ========================================================== */

async function api(
  action,
  payload={}
) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      function() {
        controller.abort();
      },
      20000
    );


  try {

    const response =
      await fetch(
        API_URL,
        {

          method:'POST',

          mode:'cors',

          cache:'no-store',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              action:action,
              payload:payload
            }),

          signal:
            controller.signal
        }
      );


    const text =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(text);

    } catch (error) {

      throw new Error(
        'API ตอบกลับผิดรูปแบบ'
      );
    }


    if (!response.ok) {

      throw new Error(
        'HTTP ' +
        response.status +
        ': ' +
        (
          data.message ||
          'API Error'
        )
      );
    }


    if (!data.success) {

      throw new Error(
        data.message ||
        'ไม่สามารถดำเนินการได้'
      );
    }


    return data;


  } catch (error) {

    if (
      error.name ===
      'AbortError'
    ) {

      throw new Error(
        'เชื่อมต่อระบบนานเกินไป'
      );
    }


    if (
      String(
        error.message || error
      )
        .toLowerCase()
        .includes(
          'load failed'
        )
    ) {

      throw new Error(
        'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่'
      );
    }


    throw error;


  } finally {

    clearTimeout(timer);
  }
}


/* ==========================================================
   CAMERA
   ========================================================== */

async function startCamera() {

  if (state.running) {
    return;
  }


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (!cameras.length) {

      throw new Error(
        'ไม่พบกล้อง'
      );
    }


    const camera =
      cameras[
        cameras.length - 1
      ];


    state.scanner =
      new Html5Qrcode(
        'reader'
      );


    await state.scanner.start(

      camera.id,

      {
        fps:10,

        qrbox:{
          width:260,
          height:260
        }
      },

      qrSuccess,

      function(){}
    );


    state.running =
      true;


  } catch (error) {

    setStatus(
      'เปิดกล้องไม่ได้: ' +
      getError(error),
      true
    );
  }
}


async function stopCamera() {

  if (!state.scanner) {

    state.running =
      false;

    return;
  }


  try {

    if (state.running) {

      await state.scanner.stop();
    }

    state.scanner.clear();

  } catch (error) {}


  state.scanner =
    null;

  state.running =
    false;
}


/* ==========================================================
   QR
   ========================================================== */

async function qrSuccess(
  value
) {

  if (
    state.lock ||
    !value
  ) {
    return;
  }


  state.lock =
    true;

  state.qr =
    String(value).trim();


  loading(
    true,
    'กำลังตรวจสอบสมาชิก...'
  );


  try {

    const member =
      await api(
        'PREVIEW',
        {
          scannedQr:
            state.qr
        }
      );


    await stopCamera();

    openMember(
      member
    );


  } catch (error) {

    state.lock =
      false;

    state.qr =
      '';

    setStatus(
      getError(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* ==========================================================
   TABS
   ========================================================== */

async function showQr() {

  state.mode =
    'QR';

  activateTab(
    'tabQr'
  );

  resetMember();

  hide('searchSection');
  hide('memberSection');

  show('qrSection');

  setStatus(
    'พร้อมสแกน QR'
  );

  await startCamera();
}


async function showSearch() {

  state.mode =
    'SEARCH';

  activateTab(
    'tabSearch'
  );

  await stopCamera();

  resetMember();

  hide('qrSection');
  hide('memberSection');

  show('searchSection');

  clearSearch();

  setStatus(
    'ค้นหาสมาชิก'
  );
}


async function showRewardSearch() {

  state.mode =
    'REWARD';

  activateTab(
    'tabReward'
  );

  await stopCamera();

  resetMember();

  hide('qrSection');
  hide('memberSection');

  show('searchSection');

  clearSearch();

  setStatus(
    'ค้นหาสมาชิกเพื่อแลกแต้ม'
  );
}


function activateTab(id) {

  document
    .querySelectorAll('.tab')
    .forEach(
      function(element) {

        element
          .classList
          .remove('active');
      }
    );

  document
    .getElementById(id)
    .classList
    .add('active');
}


/* ==========================================================
   SEARCH
   ========================================================== */

function clearSearch() {

  document
    .getElementById(
      'searchInput'
    )
    .value =
      '';

  document
    .getElementById(
      'searchResults'
    )
    .innerHTML =
      '';
}


function searchChanged() {

  clearTimeout(
    searchTimer
  );

  searchTimer =
    setTimeout(
      searchMembers,
      350
    );
}


async function searchMembers() {

  const query =
    document
      .getElementById(
        'searchInput'
      )
      .value
      .trim();


  const container =
    document
      .getElementById(
        'searchResults'
      );


  if (query.length < 2) {

    container.innerHTML =
      '';

    return;
  }


  container.innerHTML =
    '<div class="subtitle">กำลังค้นหา...</div>';


  try {

    const result =
      await api(
        'SEARCH_MEMBER',
        {
          query:query
        }
      );


    const members =
      result.members || [];


    if (!members.length) {

      container.innerHTML =
        '<div class="subtitle">ไม่พบสมาชิก</div>';

      return;
    }


    container.innerHTML =
      '';


    members.forEach(
      function(member) {

        const button =
          document
            .createElement(
              'button'
            );

        button.type =
          'button';

        button.className =
          'result';

        button.innerHTML =
          '<div class="result-name">' +
          escapeHtml(
            member.fullName
          ) +
          '</div>' +
          '<div class="result-id">' +
          escapeHtml(
            member.memberId
          ) +
          '</div>';

        button.onclick =
          function() {

            selectMember(
              member.memberId
            );
          };

        container.appendChild(
          button
        );
      });


  } catch (error) {

    setStatus(
      getError(error),
      true
    );
  }
}


async function selectMember(
  memberId
) {

  loading(
    true,
    'กำลังเปิดสมาชิก...'
  );


  try {

    const member =
      await api(
        'PREVIEW_MEMBER',
        {
          memberId:memberId
        }
      );

    openMember(
      member
    );


  } catch (error) {

    setStatus(
      getError(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* ==========================================================
   MEMBER
   ========================================================== */

async function openMember(
  member
) {

  state.member =
    member;


  hide('qrSection');
  hide('searchSection');

  show('memberSection');


  document
    .getElementById(
      'memberName'
    )
    .textContent =
      member.fullName || '-';


  document
    .getElementById(
      'memberId'
    )
    .textContent =
      member.memberId || '';


  document
    .getElementById(
      'lifetimePoints'
    )
    .textContent =
      Number(
        member.lifetimePoints || 0
      );


  document
    .getElementById(
      'availablePoints'
    )
    .textContent =
      Number(
        member.availablePoints !==
        undefined
          ? member.availablePoints
          : (
              member.totalPoints || 0
            )
      );


  document
    .getElementById(
      'rank'
    )
    .textContent =
      member.currentRank
        ? '#' +
          member.currentRank
        : '-';


  if (
    state.mode ===
    'REWARD'
  ) {

    hide('activityCard');
    hide('photoCard');

    show('rewardCard');

    await loadRewards();

  } else {

    show('activityCard');
    show('photoCard');

    hide('rewardCard');

    setStatus(
      'เลือกกิจกรรมและถ่ายภาพ'
    );
  }
}


/* ==========================================================
   ACTIVITIES
   ========================================================== */

function renderActivities() {

  const container =
    document
      .getElementById(
        'activityGrid'
      );


  container.innerHTML =
    '';


  state.activities.forEach(
    function(activity) {

      const button =
        document
          .createElement(
            'button'
          );

      button.type =
        'button';

      button.className =
        'activity';


      const health =
        activity.activityType ===
        'HEALTH_CHECK';


      button.innerHTML =
        '<div class="item-title">' +
        escapeHtml(
          activity.activityName
        ) +
        '</div>' +

        '<div class="item-sub">' +

        (
          health
            ? 'รออนุมัติ +' +
              Number(
                activity.point || 2
              ) +
              ' คะแนน'

            : '+' +
              Number(
                activity.point || 0
              ) +
              ' คะแนน'
        ) +

        '</div>';


      button.onclick =
        function() {

          state.activityId =
            activity.activityId;


          document
            .querySelectorAll(
              '.activity'
            )
            .forEach(
              function(item) {

                item.classList
                  .remove(
                    'selected'
                  );
              }
            );


          button.classList
            .add(
              'selected'
            );
        };


      container.appendChild(
        button
      );
    }
  );
}


/* ==========================================================
   PHOTO
   ========================================================== */

function takePhoto() {

  const input =
    document
      .getElementById(
        'photoInput'
      );

  input.value =
    '';

  input.click();
}


async function photoChanged(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  loading(
    true,
    'กำลังเตรียมรูป...'
  );


  try {

    state.photo =
      await resizePhoto(
        file
      );


    const preview =
      document
        .getElementById(
          'photoPreview'
        );


    preview.src =
      state.photo;

    show(
      'photoPreview'
    );


  } finally {

    loading(false);
  }
}


function resizePhoto(file) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const image =
            new Image();


          image.onload =
            function() {

              const ratio =
                Math.min(
                  1,
                  600 / image.width,
                  600 / image.height
                );


              const canvas =
                document
                  .createElement(
                    'canvas'
                  );


              canvas.width =
                Math.round(
                  image.width *
                  ratio
                );


              canvas.height =
                Math.round(
                  image.height *
                  ratio
                );


              canvas
                .getContext('2d')
                .drawImage(
                  image,
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );


              resolve(
                canvas.toDataURL(
                  'image/jpeg',
                  .62
                )
              );
            };


          image.onerror =
            reject;

          image.src =
            event.target.result;
        };


      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}


/* ==========================================================
   CHECK-IN
   ========================================================== */

async function submitCheckin() {

  if (!state.member) {

    setStatus(
      'ไม่พบสมาชิก',
      true
    );

    return;
  }


  if (!state.activityId) {

    setStatus(
      'กรุณาเลือกกิจกรรม',
      true
    );

    return;
  }


  if (!state.photo) {

    setStatus(
      'กรุณาถ่ายภาพ',
      true
    );

    return;
  }


  loading(
    true,
    'กำลังบันทึก...'
  );


  try {

    const payload = {

      activityId:
        state.activityId,

      photoDataUrl:
        state.photo
    };


    if (state.qr) {

      payload.scannedQr =
        state.qr;

    } else {

      payload.memberId =
        state.member.memberId;
    }


    const result =
      await api(
        'CHECKIN',
        payload
      );


    alert(
      result.message ||
      'ลงทะเบียนสำเร็จ'
    );


    await backToScanner();


  } catch (error) {

    setStatus(
      getError(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* ==========================================================
   REWARD
   ========================================================== */

async function loadRewards() {

  loading(
    true,
    'กำลังโหลดของรางวัล...'
  );


  try {

    const result =
      await api(
        'REWARDS',
        {
          memberId:
            state.member.memberId
        }
      );


    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        Number(
          result.availablePoints || 0
        );


    const container =
      document
        .getElementById(
          'rewardGrid'
        );


    container.innerHTML =
      '';


    const rewards =
      result.rewards || [];


    if (!rewards.length) {

      container.innerHTML =
        '<div class="subtitle">ยังไม่มีของรางวัล</div>';

      return;
    }


    rewards.forEach(
      function(reward) {

        const button =
          document
            .createElement(
              'button'
            );

        button.className =
          'reward';

        button.type =
          'button';

        button.innerHTML =
          '<div class="item-title">' +
          escapeHtml(
            reward.rewardName
          ) +
          '</div>' +

          '<div class="item-sub">' +
          Number(
            reward.pointsRequired || 0
          ) +
          ' แต้ม • เหลือ ' +
          Number(
            reward.stock || 0
          ) +
          '</div>';


        button.onclick =
          function() {

            redeemReward(
              reward
            );
          };


        container.appendChild(
          button
        );
      }
    );


  } catch (error) {

    setStatus(
      getError(error),
      true
    );


  } finally {

    loading(false);
  }
}


async function redeemReward(
  reward
) {

  if (
    !confirm(
      'ยืนยันแลก ' +
      reward.rewardName +
      ' จำนวน ' +
      reward.pointsRequired +
      ' แต้ม?'
    )
  ) {

    return;
  }


  loading(
    true,
    'กำลังแลกแต้ม...'
  );


  try {

    const result =
      await api(
        'REDEEM',
        {

          memberId:
            state.member.memberId,

          rewardId:
            reward.rewardId
        }
      );


    document
      .getElementById(
        'availablePoints'
      )
      .textContent =
        result.availablePoints;


    alert(
      'แลกสำเร็จ\nแต้มคงเหลือ ' +
      result.availablePoints
    );


    await loadRewards();


  } catch (error) {

    setStatus(
      getError(error),
      true
    );


  } finally {

    loading(false);
  }
}


/* ==========================================================
   RESET
   ========================================================== */

async function backToScanner() {

  resetMember();

  state.mode =
    'QR';

  activateTab(
    'tabQr'
  );

  hide('memberSection');
  hide('searchSection');

  show('qrSection');

  setStatus(
    'พร้อมสแกนสมาชิกคนถัดไป'
  );

  await startCamera();
}


function resetMember() {

  state.member =
    null;

  state.qr =
    '';

  state.activityId =
    '';

  state.photo =
    '';

  state.lock =
    false;


  document
    .querySelectorAll(
      '.activity'
    )
    .forEach(
      function(item) {

        item.classList
          .remove(
            'selected'
          );
      }
    );


  const preview =
    document
      .getElementById(
        'photoPreview'
      );

  preview.src =
    '';

  hide(
    'photoPreview'
  );
}


/* ==========================================================
   UI
   ========================================================== */

function show(id) {

  const element =
    document.getElementById(id);

  if (element) {

    element.classList
      .remove('hidden');
  }
}


function hide(id) {

  const element =
    document.getElementById(id);

  if (element) {

    element.classList
      .add('hidden');
  }
}


function loading(
  enabled,
  text
) {

  if (enabled) {

    document
      .getElementById(
        'loadingText'
      )
      .textContent =
        text ||
        'กำลังทำงาน...';

    show('loading');

  } else {

    hide('loading');
  }
}


function setStatus(
  text,
  error
) {

  const element =
    document
      .getElementById(
        'status'
      );

  element.textContent =
    text || '';

  element.className =
    error
      ? 'error'
      : '';
}


function getError(error) {

  return (
    error &&
    error.message
  )
    ? error.message
    : String(
        error ||
        'เกิดข้อผิดพลาด'
      );
}


function escapeHtml(value) {

  return String(
    value || ''
  )
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
